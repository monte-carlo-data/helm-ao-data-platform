version: 2.1

defaults:
  - &dockerhub_context
    - docker

commands:
  install-helm:
    steps:
      - run:
          name: Install Helm
          command: |
            curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
            chmod +x get_helm.sh
            ./get_helm.sh

  add-helm-repos:
    steps:
      - run:
          name: Add chart repositories
          command: |
            helm repo add altinity https://docs.altinity.com/clickhouse-operator/
            helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts

  login-dockerhub:
    steps:
      - run:
          name: Login to Docker Hub
          command: |
            echo "$DOCKER_PASSWORD" \
              | helm registry login registry-1.docker.io --username "$DOCKER_LOGIN" --password-stdin

jobs:
  lint:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Shell syntax check (hack/)
          # 700+ lines of `set -euo pipefail` deploy-verification shell only run against a
          # live cluster, so a parse error would otherwise surface mid-deploy. Fail fast on
          # any syntax error (noexec parse — no cluster or side effects).
          command: |
            for f in hack/*.sh hack/lib/*.sh; do
              [ -e "$f" ] || continue
              bash -n "$f" || { echo "syntax error in $f"; exit 1; }
            done
            echo "hack/ shell syntax OK."
      - install-helm
      - add-helm-repos
      - run:
          name: Build chart dependencies
          command: helm dependency build charts/ao-data-platform
      - run:
          name: Lint chart
          command: helm lint charts/ao-data-platform
      - run:
          name: Render chart and verify operator label allowlist
          # `helm lint` does not fully render subchart values, so a typo or wrong
          # nesting in a deep path would pass lint while being silently ignored.
          # Render the whole chart (a clean render is itself a template-correctness
          # guard) and assert the operator's `label.include` allowlist actually
          # reaches the generated operator config — the exact gap a no-op
          # chart-version bump exploited to recreate the ClickHouse StatefulSet.
          command: |
            helm template charts/ao-data-platform \
              -f charts/ao-data-platform/ci/lint-values.yaml > rendered.yaml
            keys=$(awk '
              /^    label:/ { inlabel = 1 }
              inlabel && /^      include:/ { found = 1; next }
              found && /^      - / { print $2; next }
              found && !/^      - / { found = 0 }
            ' rendered.yaml | sort | tr "\n" " ")
            expected="app.kubernetes.io/instance app.kubernetes.io/managed-by app.kubernetes.io/name "
            if [ "$keys" != "$expected" ]; then
              echo "Operator label allowlist did not render as expected."
              echo "Expected: $expected"
              echo "Rendered: $keys"
              exit 1
            fi
            echo "Operator label.include allowlist rendered correctly."
      - run:
          name: Gateway disabled renders no gateway resources
          # The default posture is gateway.enabled=false. Assert none of the
          # gateway-only kinds leak into a non-gateway render.
          command: |
            helm template charts/ao-data-platform \
              -f charts/ao-data-platform/ci/lint-values.yaml \
              --set gateway.enabled=false > gw-off.yaml
            if grep -Eq '^kind: (Gateway|HTTPRoute|BackendTLSPolicy|Bundle|ClusterIssuer)$' gw-off.yaml; then
              echo "Gateway disabled but gateway resources rendered:"
              grep -En '^kind: (Gateway|HTTPRoute|BackendTLSPolicy|Bundle|ClusterIssuer)$' gw-off.yaml
              exit 1
            fi
            echo "Gateway disabled: no Gateway/HTTPRoute/BackendTLSPolicy/Bundle/ClusterIssuer rendered."
      - run:
          name: Invalid gateway.tls.source fails render
          # Only letsencrypt is implemented; any other source must fail fast at render.
          command: |
            if helm template charts/ao-data-platform \
              -f charts/ao-data-platform/ci/lint-values.yaml \
              --set gateway.tls.source=keyvault > /dev/null 2>&1; then
              echo "Expected render to fail for gateway.tls.source=keyvault, but it succeeded."
              exit 1
            fi
            echo "Invalid gateway.tls.source correctly failed the render."
      - run:
          name: Gateway with tls.enabled=false fails render
          # The Gateway re-encrypts to the internal-TLS backends, so it requires tls.enabled=true.
          command: |
            if helm template charts/ao-data-platform \
              -f charts/ao-data-platform/ci/lint-values.yaml \
              --set tls.enabled=false > /dev/null 2>&1; then
              echo "Expected render to fail for gateway.enabled=true with tls.enabled=false, but it succeeded."
              exit 1
            fi
            echo "Gateway with tls.enabled=false correctly failed the render."
      - run:
          name: Gateway with certManager.createCA=false fails render
          # The backend-TLS Bundle sources the chart-managed ao-data-platform-ca secret, which
          # only exists when tls.certManager.createCA=true. BYO-issuer is not yet supported, so
          # the combination must fail fast rather than render clean and deploy broken.
          command: |
            if helm template charts/ao-data-platform \
              -f charts/ao-data-platform/ci/lint-values.yaml \
              --set tls.certManager.createCA=false > /dev/null 2>&1; then
              echo "Expected render to fail for gateway.enabled=true with tls.certManager.createCA=false, but it succeeded."
              exit 1
            fi
            echo "Gateway with createCA=false correctly failed the render."
      - run:
          name: Missing required gateway field fails render
          # Representative negative-path coverage for the `required` guards (hostnames, className,
          # the four azureDNS fields): clearing one must fail the render.
          command: |
            if helm template charts/ao-data-platform \
              -f charts/ao-data-platform/ci/lint-values.yaml \
              --set gateway.tls.letsencrypt.azureDNS.hostedZoneName= > /dev/null 2>&1; then
              echo "Expected render to fail when gateway.tls.letsencrypt.azureDNS.hostedZoneName is empty, but it succeeded."
              exit 1
            fi
            echo "Missing required gateway field correctly failed the render."
      - run:
          name: Gateway allowedSourceRanges renders the annotation
          # allowedSourceRanges defaults to [] (a dark branch); lint-values sets two CIDRs, so
          # assert the azure-allowed-ip-ranges annotation renders the joined, quoted list.
          command: |
            helm template charts/ao-data-platform \
              -f charts/ao-data-platform/ci/lint-values.yaml > gw-on.yaml
            if ! grep -Eq 'azure-allowed-ip-ranges: "10\.0\.0\.0/16,192\.168\.1\.0/24"' gw-on.yaml; then
              echo "Expected azure-allowed-ip-ranges annotation with the joined CIDR list; got:"
              grep -n 'azure-allowed-ip-ranges' gw-on.yaml || echo "(annotation not found)"
              exit 1
            fi
            echo "allowedSourceRanges rendered the azure-allowed-ip-ranges annotation correctly."
      - run:
          name: gke gcpBackendSecurityPolicy renders a GCPBackendPolicy per backend
          # The gke source-range path attaches a Cloud Armor policy to each Gateway backend
          # via a GCPBackendPolicy (not an annotation). Assert both backends get one, wired
          # to the passed policy name.
          command: |
            helm template charts/ao-data-platform \
              -f charts/ao-data-platform/ci/lint-values.yaml \
              --set gateway.provider=gke --set gateway.className=gke-l7-rilb \
              --set-json 'gateway.allowedSourceRanges=[]' \
              --set gateway.gcpBackendSecurityPolicy=ci-armor > gw-gke.yaml
            count=$(grep -c '^kind: GCPBackendPolicy$' gw-gke.yaml)
            if [ "$count" -ne 2 ]; then
              echo "Expected 2 GCPBackendPolicy resources (otel + clickhouse backends); found ${count}."
              grep -nE 'GCPBackendPolicy|securityPolicy|targetRef' gw-gke.yaml || true
              exit 1
            fi
            if ! grep -Eq '^    securityPolicy: "ci-armor"$' gw-gke.yaml; then
              echo "GCPBackendPolicy did not reference the expected securityPolicy 'ci-armor'."
              exit 1
            fi
            # GKE re-encrypts to a backend only if the Service port is marked appProtocol:
            # HTTPS. The collector port is marked by the TF module; the ClickHouse https port
            # is marked by the CHI serviceTemplate here (gke only). Assert it renders.
            if ! grep -Eq '^              appProtocol: HTTPS$' gw-gke.yaml; then
              echo "Expected the gke ClickHouse https port to be marked appProtocol: HTTPS."
              exit 1
            fi
            # gke selects the cert-manager DNS-01 solver by provider: assert the ClusterIssuer
            # emits the cloudDNS solver (not azureDNS) with the passed project.
            if ! grep -q 'cloudDNS:' gw-gke.yaml || grep -q 'azureDNS:' gw-gke.yaml; then
              echo "Expected the gke ClusterIssuer to use the cloudDNS DNS-01 solver, not azureDNS."
              grep -nE 'cloudDNS|azureDNS|dns01' gw-gke.yaml || true
              exit 1
            fi
            # HealthCheckPolicy repoints the collector backend's LB health check at the :13133
            # health_check extension (gke only) — otherwise GKE defaults to HTTPS on the serving
            # port with path "/", which 404s the OTLP receiver and 503s the listener.
            if [ "$(grep -c '^kind: HealthCheckPolicy$' gw-gke.yaml)" -ne 1 ]; then
              echo "Expected exactly 1 HealthCheckPolicy (collector backend)."
              grep -nE 'HealthCheckPolicy|targetRef|port:|requestPath:' gw-gke.yaml || true
              exit 1
            fi
            # Assert the HealthCheckPolicy's fields in isolation: the combined render also
            # contains GCPBackendPolicy targetRefs named opentelemetry-collector, so grepping
            # the whole file would false-pass a mistargeted HealthCheckPolicy.
            helm template charts/ao-data-platform \
              -f charts/ao-data-platform/ci/lint-values.yaml \
              --set gateway.provider=gke --set gateway.className=gke-l7-rilb \
              --set-json 'gateway.allowedSourceRanges=[]' \
              --set gateway.gcpBackendSecurityPolicy=ci-armor \
              --show-only templates/gateway-gke-health-check.yaml > hcp.yaml
            if ! grep -Eq '^        port: 13133$' hcp.yaml || ! grep -Eq '^        requestPath: /$' hcp.yaml \
               || ! grep -Eq '^    name: opentelemetry-collector$' hcp.yaml; then
              echo "HealthCheckPolicy did not target the collector Service on port 13133 / requestPath /."
              cat hcp.yaml || true
              exit 1
            fi
            # Azure LB artifacts must never leak into a gke render — a drift in the provider
            # conditional in gateway.yaml would silently ship azure annotations on gke.
            if grep -Eq 'azure-load-balancer-internal|azure-allowed-ip-ranges' gw-gke.yaml; then
              echo "Azure LB annotation leaked into a gke render."
              grep -nE 'azure-load-balancer-internal|azure-allowed-ip-ranges' gw-gke.yaml || true
              exit 1
            fi
            echo "gke source-range + ClickHouse appProtocol + cloudDNS solver + HealthCheckPolicy rendered correctly (no azure artifacts leaked)."
      - run:
          name: gateway.className derives from provider, and an explicit value overrides
          # className is not defaulted to any one cloud; when unset it is derived from
          # gateway.provider. Assert both providers derive their canonical GatewayClass,
          # and that an explicit className overrides the derived default.
          command: |
            az=$(helm template charts/ao-data-platform -f charts/ao-data-platform/ci/lint-values.yaml \
              | grep -E '^  gatewayClassName:' | head -1)
            echo "$az" | grep -q 'approuting-istio' || { echo "azure did not derive approuting-istio: [$az]"; exit 1; }
            gk=$(helm template charts/ao-data-platform -f charts/ao-data-platform/ci/lint-values.yaml \
              --set gateway.provider=gke --set-json 'gateway.allowedSourceRanges=[]' \
              | grep -E '^  gatewayClassName:' | head -1)
            echo "$gk" | grep -q 'gke-l7-rilb' || { echo "gke did not derive gke-l7-rilb: [$gk]"; exit 1; }
            # Override branch: an explicit className is honored verbatim, not derived.
            ov=$(helm template charts/ao-data-platform -f charts/ao-data-platform/ci/lint-values.yaml \
              --set gateway.provider=gke --set gateway.className=my-custom-class \
              --set-json 'gateway.allowedSourceRanges=[]' \
              | grep -E '^  gatewayClassName:' | head -1)
            echo "$ov" | grep -q 'my-custom-class' || { echo "explicit className not honored: [$ov]"; exit 1; }
            echo "className derives (azure->approuting-istio, gke->gke-l7-rilb) and honors an explicit override."
      - run:
          name: Gateway source-range path is provider-exclusive
          # allowedSourceRanges (azure) and gcpBackendSecurityPolicy (gke) must never cross:
          # each render below sets the wrong-provider value and must fail.
          command: |
            if helm template charts/ao-data-platform \
              -f charts/ao-data-platform/ci/lint-values.yaml \
              --set gateway.provider=gke --set gateway.className=gke-l7-rilb > /dev/null 2>&1; then
              echo "Expected render to fail: allowedSourceRanges (from lint-values) set with provider=gke."
              exit 1
            fi
            if helm template charts/ao-data-platform \
              -f charts/ao-data-platform/ci/lint-values.yaml \
              --set gateway.gcpBackendSecurityPolicy=x > /dev/null 2>&1; then
              echo "Expected render to fail: gcpBackendSecurityPolicy set with provider=azure."
              exit 1
            fi
            echo "Provider-exclusive source-range validation correctly rejected both crossovers."
      - run:
          name: Invalid or missing gateway.provider fails render
          # gateway.provider is a required, validated field (no default). A logic error in the
          # gatewayValidate enum guard would render clean for the azure/gke values CI already
          # exercises; assert an unknown value and the empty default both fail the render.
          command: |
            for bad in bogus ""; do
              if helm template charts/ao-data-platform \
                -f charts/ao-data-platform/ci/lint-values.yaml \
                --set-json 'gateway.allowedSourceRanges=[]' \
                --set gateway.provider="$bad" > /dev/null 2>&1; then
                echo "Expected render to fail for gateway.provider='${bad}', but it succeeded."
                exit 1
              fi
            done
            echo "Invalid and empty gateway.provider both correctly failed the render."
      - run:
          name: gke with empty gcpBackendSecurityPolicy renders no GCPBackendPolicy
          # Empty gcpBackendSecurityPolicy = "no Cloud Armor restriction" (mirrors azure's empty
          # allowedSourceRanges). Assert the unrestricted default renders zero policies, so a
          # regression that always emits the policy is caught.
          command: |
            helm template charts/ao-data-platform \
              -f charts/ao-data-platform/ci/lint-values.yaml \
              --set gateway.provider=gke --set gateway.className=gke-l7-rilb \
              --set-json 'gateway.allowedSourceRanges=[]' > gw-gke-noarmor.yaml
            count=$(grep -c '^kind: GCPBackendPolicy$' gw-gke-noarmor.yaml || true)
            if [ "$count" -ne 0 ]; then
              echo "Expected 0 GCPBackendPolicy resources with empty gcpBackendSecurityPolicy; found ${count}."
              exit 1
            fi
            echo "Empty gcpBackendSecurityPolicy correctly rendered no GCPBackendPolicy."
      - run:
          name: Gateway cross-references are internally consistent
          # The gateway templates cross-reference by string literal, so a rename in one file
          # renders clean but breaks TLS at apply. Assert the in-render seams line up. (Service
          # backends like clickhouse-otel are created by the Altinity operator at runtime, not by
          # `helm template`, so they can't be checked statically here.)
          command: |
            helm template charts/ao-data-platform \
              -f charts/ao-data-platform/ci/lint-values.yaml > gw-on.yaml
            # Each Gateway certificateRefs name must be produced as a Certificate secretName.
            for name in gateway-otel-tls gateway-clickhouse-tls; do
              if ! grep -Eq "^  secretName: ${name}$" gw-on.yaml; then
                echo "Gateway certificateRef '${name}' has no matching Certificate secretName."
                exit 1
              fi
            done
            # The trust-manager Bundle name must equal the ConfigMap both BackendTLSPolicies
            # reference (Bundle metadata.name + 2 caCertificateRefs = 3 occurrences).
            bundle=$(awk '/kind: Bundle/{f=1} f && /^  name: /{print $2; exit}' gw-on.yaml)
            count=$(grep -Ec "name: ${bundle}$" gw-on.yaml)
            if [ "$count" -ne 3 ]; then
              echo "Bundle '${bundle}' must appear 3x (Bundle + 2 caCertificateRefs); found ${count}."
              exit 1
            fi
            echo "certificateRefs<->secretName and Bundle<->caCertificateRefs are consistent."
            # The two gke policy templates (HealthCheckPolicy, GCPBackendPolicy) reference the
            # collector and ClickHouse Services by string literal, outside the certificateRef
            # seams above — a rename there renders clean but breaks routing at apply. Render gke
            # and anchor both names to the rest of the render.
            helm template charts/ao-data-platform \
              -f charts/ao-data-platform/ci/lint-values.yaml \
              --set gateway.provider=gke --set gateway.className=gke-l7-rilb \
              --set-json 'gateway.allowedSourceRanges=[]' \
              --set gateway.gcpBackendSecurityPolicy=ci-armor > gw-gke.yaml
            # opentelemetry-collector is rendered by the subchart → static equality: the name the
            # gke templates target must exist as a real Service.
            if ! awk '/^kind: Service$/{s=1;next} s&&/^  name: /{if($2=="opentelemetry-collector")f=1; s=0} END{exit !f}' gw-gke.yaml; then
              echo "No Service named 'opentelemetry-collector' in the gke render — a gke targetRef literal has drifted from the collector Service."
              exit 1
            fi
            # clickhouse-otel is operator-created (not rendered), so anchor it to the HTTPRoute
            # backendRef it must route to — a rename in one gke template would orphan it.
            if ! grep -Eq '^        - name: clickhouse-otel$' gw-gke.yaml; then
              echo "clickhouse-otel is not an HTTPRoute backendRef in the gke render — a service-name literal has drifted."
              exit 1
            fi
            echo "gke Service-name cross-references (opentelemetry-collector, clickhouse-otel) are consistent."
      - run:
          name: llm-worker core labels win over colliding podLabels
          # Guards the round-1 ordering fix (core labels emitted after podLabels, so YAML
          # last-wins keeps the core value on collision). A future edit reversing the order
          # would let a podLabel override the component label — this pins it.
          command: |
            helm template charts/ao-data-platform \
              -f charts/ao-data-platform/ci/lint-values.yaml \
              --set 'llmWorker.podLabels.app\.kubernetes\.io/component=hijacked' \
              --show-only templates/llm-worker-deployment.yaml > lw.yaml
            if ! grep -q 'app.kubernetes.io/component: hijacked' lw.yaml; then
              echo "Test setup broken: the colliding podLabel did not render."
              exit 1
            fi
            # Pod-template labels are the last labels block; core is emitted last within it, so
            # the final component line must be llm-worker (not the injected override).
            last=$(grep 'app.kubernetes.io/component:' lw.yaml | tail -1 | awk '{print $2}')
            if [ "$last" != "llm-worker" ]; then
              echo "Core component label must win over the colliding podLabel; last-wins value was '${last}'."
              exit 1
            fi
            echo "Core labels correctly win over colliding podLabels."
      - run:
          name: Verify rendered ClickHouse replication wiring
          # The CHI's `settings:` block is free-form passthrough — a wrong nesting
          # level or a mistyped macro token renders cleanly, stays symptomless while
          # the tables are plain MergeTree, and first fails during the production
          # MergeTree->Replicated conversion (see the README's Keeper section). Same
          # failure class as the label allowlist above, so assert the rendered CHI:
          # the macro-based default_replica_path/name at their exact nesting depth,
          # the zookeeper wiring to the Keeper Service, and that keeper.replicasCount
          # (set to a non-default 5 in ci/lint-values.yaml) actually reaches the
          # CHK's layout — a misnamed values key would silently render the default.
          command: |
            facts=$(awk '
              /^---$/ { chi = 0; chk = 0; zk = 0; set = 0 }
              /^kind: "ClickHouseInstallation"$/       { chi = 1 }
              /^kind: "ClickHouseKeeperInstallation"$/ { chk = 1 }
              chi && /^    [a-zA-Z]/   { zk = 0; set = 0 }
              chi && /^    zookeeper:/ { zk = 1 }
              chi && /^    settings:/  { set = 1 }
              chi && zk  && /^        - host: /             { print "zkhost=" $3 }
              chi && zk  && /^          port: /             { print "zkport=" $2 }
              chi && set && /^      default_replica_path: / { print "path=" $2 }
              chi && set && /^      default_replica_name: / { print "name=" $2 }
              chk && /^    [a-zA-Z]/   { kset = 0 }
              chk && /^    settings:/  { kset = 1 }
              chk && kset && /^      keeper_server\/four_letter_word_allow_list: / { print "fourlw=" $2 }
              chk && /^          replicasCount: /           { print "voters=" $2 }
            ' rendered.yaml)
            assert_fact() {
              if ! echo "$facts" | grep -qxF "$1"; then
                echo "Rendered replication wiring is wrong or missing: expected '$1'."
                echo "Extracted facts were:"
                echo "$facts"
                exit 1
              fi
            }
            assert_fact 'path="/clickhouse/tables/{cluster}/{shard}/{database}/{table}"'
            assert_fact 'name="{replica}"'
            assert_fact 'zkhost=keeper-otel'
            assert_fact 'zkport=2181'
            assert_fact 'voters=5'
            assert_fact 'fourlw="ruok,mntr,srvr,stat,conf"'
            echo "ClickHouse replication wiring rendered correctly."
      - run:
          name: Verify rendered readiness probe and probe-user wiring
          # The /ready chain has several links that drop out silently: the handler
          # XML, the probe user file, and its two config grants. Losing the SHOW
          # TABLES grant is the worst class — system.replicas filters rows to
          # tables the querying user can see, so the probe would read an empty
          # table and never fail (a readonly replica stays "ready"). Assert each
          # link in the TLS-on render, plus the cluster secret, the schema_owner
          # CLUSTER grant (ON CLUSTER DDL fails ACCESS_DENIED without it), and
          # the hard zone spread on both the CHI and CHK pod templates.
          command: |
            assert_rendered() {
              # `--` so patterns beginning with `-` (the YAML list items) are not
              # parsed as grep options.
              if ! grep -qF -- "$1" rendered.yaml; then
                echo "Missing from render: $1"
                exit 1
              fi
            }
            assert_rendered 'users.d/probe_user.xml: |'
            assert_rendered 'config.d/readiness_handler.xml: |'
            assert_rendered '<query>GRANT SELECT ON system.replicas</query>'
            assert_rendered '<query>GRANT SHOW TABLES ON otel_traces.*</query>'
            assert_rendered '- "GRANT CLUSTER ON *.*"'
            assert_rendered 'clickhouse.altinity.com/chi: otel'
            assert_rendered 'clickhouse-keeper.altinity.com/chk: otel'
            # The auto cluster secret must sit under the cluster's `secret:` key —
            # `auto:` alone also appears in the operator CRD schema.
            if ! grep -B1 'auto: "true"' rendered.yaml | grep -q 'secret:'; then
              echo 'Cluster `secret: {auto: "true"}` did not render.'
              exit 1
            fi
            # lint-values render TLS-on: /ready must probe the HTTPS port.
            probe=$(grep -A3 'path: /ready' rendered.yaml)
            for want in 'port: 8443' 'scheme: HTTPS'; do
              if ! echo "$probe" | grep -q "$want"; then
                echo "TLS-on /ready readinessProbe missing '$want'; block was:"
                echo "$probe"
                exit 1
              fi
            done
            echo "Readiness probe and probe-user wiring rendered correctly."
      - run:
          name: Dev shape (1 replica / 1 voter, TLS off) renders
          # The documented dev/single-AZ shape appears nowhere in the default
          # render: 1 ClickHouse replica, 1 Keeper voter, TLS off. Render it and
          # assert both counts reach their layouts and the /ready probe flips to
          # plain HTTP 8123 — the TLS-off branch of the probe wiring is otherwise
          # never exercised in CI.
          command: |
            helm template charts/ao-data-platform \
              -f charts/ao-data-platform/ci/lint-values.yaml \
              --set gateway.enabled=false \
              --set tls.enabled=false \
              --set clickhouse.replicasCount=1 \
              --set keeper.replicasCount=1 > dev-shape.yaml
            count=$(grep -Ec '^          replicasCount: 1$' dev-shape.yaml)
            if [ "$count" -ne 2 ]; then
              echo "Expected replicasCount: 1 in both the CHI and CHK layouts; found ${count} occurrence(s)."
              exit 1
            fi
            probe=$(grep -A3 'path: /ready' dev-shape.yaml)
            if ! echo "$probe" | grep -q 'port: 8123'; then
              echo "TLS-off /ready readinessProbe must target port 8123; block was:"
              echo "$probe"
              exit 1
            fi
            if echo "$probe" | grep -q 'scheme: HTTPS'; then
              echo "TLS-off /ready readinessProbe must not set scheme: HTTPS; block was:"
              echo "$probe"
              exit 1
            fi
            echo "Dev shape rendered correctly with plain-HTTP readiness."
      - run:
          name: Schema SQL is clustered-only
          # Every table the chart creates must be a path-less Replicated* engine
          # and every DDL statement must run ON CLUSTER — a plain-MergeTree or
          # non-cluster statement installs fine on one replica, then surfaces as
          # a missing table or an independent empty lineage on the other. Pure
          # source greps; no render needed.
          command: |
            fail=0
            ddl=$(grep -En '^(CREATE|ALTER|DROP|RENAME|ATTACH|DETACH|TRUNCATE) ' charts/ao-data-platform/sql/*.sql || true)
            if [ -z "$ddl" ]; then
              echo "Sanity check failed: no DDL statements matched in charts/ao-data-platform/sql/ — the grep pattern has drifted."
              exit 1
            fi
            missing=$(echo "$ddl" | grep -v "ON CLUSTER '{cluster}'" || true)
            if [ -n "$missing" ]; then
              echo "DDL without ON CLUSTER '{cluster}':"
              echo "$missing"
              fail=1
            fi
            if grep -En 'ENGINE = ' charts/ao-data-platform/sql/*.sql | grep -v 'ENGINE = Replicated'; then
              echo "Non-Replicated engine in schema SQL (lines above)."
              fail=1
            fi
            if grep -n '/clickhouse/' charts/ao-data-platform/sql/*.sql; then
              echo "Explicit replication path in schema SQL (lines above) — engines must stay path-less (default_replica_path owns the layout)."
              fail=1
            fi
            [ "$fail" -eq 0 ] && echo "Schema SQL is clustered-only: ON CLUSTER DDL, path-less Replicated engines."
            exit $fail
      - run:
          name: llm-worker foundry provider renders Foundry env, no AWS env
          # provider=foundry emits LLM_PROVIDER=foundry + ANTHROPIC_FOUNDRY_RESOURCE
          # and drops the bedrock-only AWS_REGION.
          command: |
            helm template charts/ao-data-platform \
              -f charts/ao-data-platform/ci/lint-values.yaml \
              --set llmWorker.provider=foundry \
              --set llmWorker.foundry.resource=mc-ao-foundry \
              --show-only templates/llm-worker-deployment.yaml > lw-foundry.yaml
            if ! grep -q 'value: "foundry"' lw-foundry.yaml; then
              echo "LLM_PROVIDER=foundry not rendered."; exit 1
            fi
            if ! grep -q 'name: ANTHROPIC_FOUNDRY_RESOURCE' lw-foundry.yaml; then
              echo "ANTHROPIC_FOUNDRY_RESOURCE not rendered for foundry."; exit 1
            fi
            if grep -q 'name: AWS_REGION' lw-foundry.yaml; then
              echo "AWS_REGION must not render for foundry."; exit 1
            fi
            echo "foundry provider renders Foundry env, no AWS env."
      - run:
          name: llm-worker bedrock provider renders AWS env, no Foundry env
          # Default (bedrock) keeps AWS_REGION and emits no Foundry env — the AWS
          # path is behaviorally unchanged by the provider-selection addition.
          command: |
            helm template charts/ao-data-platform \
              -f charts/ao-data-platform/ci/lint-values.yaml \
              --show-only templates/llm-worker-deployment.yaml > lw-bedrock.yaml
            if ! grep -q 'value: "bedrock"' lw-bedrock.yaml; then
              echo "LLM_PROVIDER=bedrock not rendered."; exit 1
            fi
            if ! grep -q 'name: AWS_REGION' lw-bedrock.yaml; then
              echo "AWS_REGION not rendered for bedrock."; exit 1
            fi
            if grep -q 'ANTHROPIC_FOUNDRY_RESOURCE' lw-bedrock.yaml; then
              echo "Foundry env must not render for bedrock."; exit 1
            fi
            echo "bedrock provider renders AWS env, no Foundry env."
      - run:
          name: llm-worker vertex provider renders Vertex env, no AWS/Foundry env
          # provider=vertex emits LLM_PROVIDER=vertex + ANTHROPIC_VERTEX_PROJECT_ID
          # + CLOUD_ML_REGION, and no AWS_REGION / ANTHROPIC_FOUNDRY_RESOURCE.
          command: |
            helm template charts/ao-data-platform \
              -f charts/ao-data-platform/ci/lint-values.yaml \
              --set llmWorker.provider=vertex \
              --set llmWorker.vertex.project=mc-ao-gcp \
              --show-only templates/llm-worker-deployment.yaml > lw-vertex.yaml
            if ! grep -q 'value: "vertex"' lw-vertex.yaml; then
              echo "LLM_PROVIDER=vertex not rendered."; exit 1
            fi
            if ! grep -q 'name: ANTHROPIC_VERTEX_PROJECT_ID' lw-vertex.yaml; then
              echo "ANTHROPIC_VERTEX_PROJECT_ID not rendered for vertex."; exit 1
            fi
            if grep -qE 'name: (AWS_REGION|ANTHROPIC_FOUNDRY_RESOURCE)' lw-vertex.yaml; then
              echo "AWS/Foundry env must not render for vertex."; exit 1
            fi
            echo "vertex provider renders Vertex env, no AWS/Foundry env."
      - run:
          name: Invalid llmWorker.provider config fails render
          # The llmWorkerValidate guard must fail fast for an unknown provider and
          # for foundry missing its required resource.
          command: |
            if helm template charts/ao-data-platform \
              -f charts/ao-data-platform/ci/lint-values.yaml \
              --set llmWorker.provider=bogus > /dev/null 2>&1; then
              echo "Expected render to fail for llmWorker.provider=bogus, but it succeeded."; exit 1
            fi
            if helm template charts/ao-data-platform \
              -f charts/ao-data-platform/ci/lint-values.yaml \
              --set llmWorker.provider=foundry > /dev/null 2>&1; then
              echo "Expected render to fail for foundry with no resource, but it succeeded."; exit 1
            fi
            if helm template charts/ao-data-platform \
              -f charts/ao-data-platform/ci/lint-values.yaml \
              --set llmWorker.provider=vertex > /dev/null 2>&1; then
              echo "Expected render to fail for vertex with no project, but it succeeded."; exit 1
            fi
            echo "Invalid llmWorker.provider config correctly failed the render."

  publish-dev:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - install-helm
      - login-dockerhub
      - add-helm-repos
      - run:
          name: Build and publish dev chart (latest + per-commit)
          command: |
            SHORT_SHA=$(git rev-parse --short=7 HEAD)
            DEV_VERSION="0.0.0-dev.g${SHORT_SHA}"
            helm dependency build charts/ao-data-platform
            helm package charts/ao-data-platform --version "$DEV_VERSION"
            helm push "ao-data-platform-${DEV_VERSION}.tgz" "oci://registry-1.docker.io/montecarlodata"
            helm package charts/ao-data-platform --version "0.0.0-latest"
            helm push "ao-data-platform-0.0.0-latest.tgz" "oci://registry-1.docker.io/montecarlodata"
            echo "Published ${DEV_VERSION} and 0.0.0-latest"

  publish-tag:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Verify tag is on main
          command: |
            git fetch --quiet origin main
            if ! git merge-base --is-ancestor "$CIRCLE_TAG" origin/main; then
              echo "Tag $CIRCLE_TAG is not an ancestor of origin/main — refusing to publish."
              exit 1
            fi
            echo "Tag $CIRCLE_TAG is on main, proceeding."
      - run:
          name: Verify Chart.yaml version matches tag
          command: |
            CHART_VERSION=$(awk '/^version:/ {gsub(/"/, "", $2); print $2; exit}' charts/ao-data-platform/Chart.yaml)
            EXPECTED="${CIRCLE_TAG#v}"
            if [ "$CHART_VERSION" != "$EXPECTED" ]; then
              echo "Chart.yaml version ($CHART_VERSION) does not match tag ($EXPECTED) — refusing to publish."
              exit 1
            fi
            echo "Chart.yaml version ($CHART_VERSION) matches tag, proceeding."
      - install-helm
      - login-dockerhub
      - add-helm-repos
      - run:
          name: Build and publish tagged release
          command: |
            VERSION="${CIRCLE_TAG#v}"
            echo "Publishing chart version: $VERSION"
            helm dependency build charts/ao-data-platform
            helm package charts/ao-data-platform --version "$VERSION"
            helm push "ao-data-platform-${VERSION}.tgz" "oci://registry-1.docker.io/montecarlodata"

workflows:
  build:
    jobs:
      - lint:
          filters:
            tags:
              only: /^v.*/
      - publish-dev:
          requires:
            - lint
          context: *dockerhub_context
          filters:
            branches:
              only: dev
      - publish-tag:
          requires:
            - lint
          context: *dockerhub_context
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
