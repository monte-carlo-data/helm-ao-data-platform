version: 2.1

defaults:
  - &dockerhub_context
    - docker

commands:
  install-helm:
    steps:
      - run:
          name: Install Helm
          command: |
            curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
            chmod +x get_helm.sh
            ./get_helm.sh

  add-helm-repos:
    steps:
      - run:
          name: Add chart repositories
          command: |
            helm repo add altinity https://docs.altinity.com/clickhouse-operator/
            helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts

  login-dockerhub:
    steps:
      - run:
          name: Login to Docker Hub
          command: |
            echo "$DOCKER_PASSWORD" \
              | helm registry login registry-1.docker.io --username "$DOCKER_LOGIN" --password-stdin

jobs:
  lint:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - install-helm
      - add-helm-repos
      - run:
          name: Build chart dependencies
          command: helm dependency build charts/ao-data-platform
      - run:
          name: Lint chart
          command: helm lint charts/ao-data-platform
      - run:
          name: Render chart and verify operator label allowlist
          # `helm lint` does not fully render subchart values, so a typo or wrong
          # nesting in a deep path would pass lint while being silently ignored.
          # Render the whole chart (a clean render is itself a template-correctness
          # guard) and assert the operator's `label.include` allowlist actually
          # reaches the generated operator config — the exact gap a no-op
          # chart-version bump exploited to recreate the ClickHouse StatefulSet.
          command: |
            helm template charts/ao-data-platform \
              -f charts/ao-data-platform/ci/lint-values.yaml > rendered.yaml
            keys=$(awk '
              /^    label:/ { inlabel = 1 }
              inlabel && /^      include:/ { found = 1; next }
              found && /^      - / { print $2; next }
              found && !/^      - / { found = 0 }
            ' rendered.yaml | sort | tr "\n" " ")
            expected="app.kubernetes.io/instance app.kubernetes.io/managed-by app.kubernetes.io/name "
            if [ "$keys" != "$expected" ]; then
              echo "Operator label allowlist did not render as expected."
              echo "Expected: $expected"
              echo "Rendered: $keys"
              exit 1
            fi
            echo "Operator label.include allowlist rendered correctly."
      - run:
          name: Gateway disabled renders no gateway resources
          # The default posture is gateway.enabled=false. Assert none of the
          # gateway-only kinds leak into a non-gateway render.
          command: |
            helm template charts/ao-data-platform \
              -f charts/ao-data-platform/ci/lint-values.yaml \
              --set gateway.enabled=false > gw-off.yaml
            if grep -Eq '^kind: (Gateway|HTTPRoute|BackendTLSPolicy|Bundle|ClusterIssuer)$' gw-off.yaml; then
              echo "Gateway disabled but gateway resources rendered:"
              grep -En '^kind: (Gateway|HTTPRoute|BackendTLSPolicy|Bundle|ClusterIssuer)$' gw-off.yaml
              exit 1
            fi
            echo "Gateway disabled: no Gateway/HTTPRoute/BackendTLSPolicy/Bundle/ClusterIssuer rendered."
      - run:
          name: Invalid gateway.tls.source fails render
          # Only letsencrypt is implemented; any other source must fail fast at render.
          command: |
            if helm template charts/ao-data-platform \
              -f charts/ao-data-platform/ci/lint-values.yaml \
              --set gateway.tls.source=keyvault > /dev/null 2>&1; then
              echo "Expected render to fail for gateway.tls.source=keyvault, but it succeeded."
              exit 1
            fi
            echo "Invalid gateway.tls.source correctly failed the render."
      - run:
          name: Gateway with tls.enabled=false fails render
          # The Gateway re-encrypts to the internal-TLS backends, so it requires tls.enabled=true.
          command: |
            if helm template charts/ao-data-platform \
              -f charts/ao-data-platform/ci/lint-values.yaml \
              --set tls.enabled=false > /dev/null 2>&1; then
              echo "Expected render to fail for gateway.enabled=true with tls.enabled=false, but it succeeded."
              exit 1
            fi
            echo "Gateway with tls.enabled=false correctly failed the render."
      - run:
          name: Gateway with certManager.createCA=false fails render
          # The backend-TLS Bundle sources the chart-managed ao-data-platform-ca secret, which
          # only exists when tls.certManager.createCA=true. BYO-issuer is not yet supported, so
          # the combination must fail fast rather than render clean and deploy broken.
          command: |
            if helm template charts/ao-data-platform \
              -f charts/ao-data-platform/ci/lint-values.yaml \
              --set tls.certManager.createCA=false > /dev/null 2>&1; then
              echo "Expected render to fail for gateway.enabled=true with tls.certManager.createCA=false, but it succeeded."
              exit 1
            fi
            echo "Gateway with createCA=false correctly failed the render."
      - run:
          name: Missing required gateway field fails render
          # Representative negative-path coverage for the `required` guards (hostnames, className,
          # the four azureDNS fields): clearing one must fail the render.
          command: |
            if helm template charts/ao-data-platform \
              -f charts/ao-data-platform/ci/lint-values.yaml \
              --set gateway.tls.letsencrypt.azureDNS.hostedZoneName= > /dev/null 2>&1; then
              echo "Expected render to fail when gateway.tls.letsencrypt.azureDNS.hostedZoneName is empty, but it succeeded."
              exit 1
            fi
            echo "Missing required gateway field correctly failed the render."
      - run:
          name: Gateway allowedSourceRanges renders the annotation
          # allowedSourceRanges defaults to [] (a dark branch); lint-values sets two CIDRs, so
          # assert the azure-allowed-ip-ranges annotation renders the joined, quoted list.
          command: |
            helm template charts/ao-data-platform \
              -f charts/ao-data-platform/ci/lint-values.yaml > gw-on.yaml
            if ! grep -Eq 'azure-allowed-ip-ranges: "10\.0\.0\.0/16,192\.168\.1\.0/24"' gw-on.yaml; then
              echo "Expected azure-allowed-ip-ranges annotation with the joined CIDR list; got:"
              grep -n 'azure-allowed-ip-ranges' gw-on.yaml || echo "(annotation not found)"
              exit 1
            fi
            echo "allowedSourceRanges rendered the azure-allowed-ip-ranges annotation correctly."
      - run:
          name: Gateway cross-references are internally consistent
          # The gateway templates cross-reference by string literal, so a rename in one file
          # renders clean but breaks TLS at apply. Assert the in-render seams line up. (Service
          # backends like clickhouse-otel are created by the Altinity operator at runtime, not by
          # `helm template`, so they can't be checked statically here.)
          command: |
            helm template charts/ao-data-platform \
              -f charts/ao-data-platform/ci/lint-values.yaml > gw-on.yaml
            # Each Gateway certificateRefs name must be produced as a Certificate secretName.
            for name in gateway-otel-tls gateway-clickhouse-tls; do
              if ! grep -Eq "^  secretName: ${name}$" gw-on.yaml; then
                echo "Gateway certificateRef '${name}' has no matching Certificate secretName."
                exit 1
              fi
            done
            # The trust-manager Bundle name must equal the ConfigMap both BackendTLSPolicies
            # reference (Bundle metadata.name + 2 caCertificateRefs = 3 occurrences).
            bundle=$(awk '/kind: Bundle/{f=1} f && /^  name: /{print $2; exit}' gw-on.yaml)
            count=$(grep -Ec "name: ${bundle}$" gw-on.yaml)
            if [ "$count" -ne 3 ]; then
              echo "Bundle '${bundle}' must appear 3x (Bundle + 2 caCertificateRefs); found ${count}."
              exit 1
            fi
            echo "certificateRefs<->secretName and Bundle<->caCertificateRefs are consistent."
      - run:
          name: llm-worker core labels win over colliding podLabels
          # Guards the round-1 ordering fix (core labels emitted after podLabels, so YAML
          # last-wins keeps the core value on collision). A future edit reversing the order
          # would let a podLabel override the component label — this pins it.
          command: |
            helm template charts/ao-data-platform \
              -f charts/ao-data-platform/ci/lint-values.yaml \
              --set 'llmWorker.podLabels.app\.kubernetes\.io/component=hijacked' \
              --show-only templates/llm-worker-deployment.yaml > lw.yaml
            if ! grep -q 'app.kubernetes.io/component: hijacked' lw.yaml; then
              echo "Test setup broken: the colliding podLabel did not render."
              exit 1
            fi
            # Pod-template labels are the last labels block; core is emitted last within it, so
            # the final component line must be llm-worker (not the injected override).
            last=$(grep 'app.kubernetes.io/component:' lw.yaml | tail -1 | awk '{print $2}')
            if [ "$last" != "llm-worker" ]; then
              echo "Core component label must win over the colliding podLabel; last-wins value was '${last}'."
              exit 1
            fi
            echo "Core labels correctly win over colliding podLabels."
      - run:
          name: Verify rendered ClickHouse replication wiring
          # The CHI's `settings:` block is free-form passthrough — a wrong nesting
          # level or a mistyped macro token renders cleanly, stays symptomless while
          # the tables are plain MergeTree, and first fails during the production
          # MergeTree->Replicated conversion (see the README's Keeper section). Same
          # failure class as the label allowlist above, so assert the rendered CHI:
          # the macro-based default_replica_path/name at their exact nesting depth,
          # the zookeeper wiring to the Keeper Service, and that keeper.replicasCount
          # (set to a non-default 5 in ci/lint-values.yaml) actually reaches the
          # CHK's layout — a misnamed values key would silently render the default.
          command: |
            facts=$(awk '
              /^---$/ { chi = 0; chk = 0; zk = 0; set = 0 }
              /^kind: "ClickHouseInstallation"$/       { chi = 1 }
              /^kind: "ClickHouseKeeperInstallation"$/ { chk = 1 }
              chi && /^    [a-zA-Z]/   { zk = 0; set = 0 }
              chi && /^    zookeeper:/ { zk = 1 }
              chi && /^    settings:/  { set = 1 }
              chi && zk  && /^        - host: /             { print "zkhost=" $3 }
              chi && zk  && /^          port: /             { print "zkport=" $2 }
              chi && set && /^      default_replica_path: / { print "path=" $2 }
              chi && set && /^      default_replica_name: / { print "name=" $2 }
              chk && /^    [a-zA-Z]/   { kset = 0 }
              chk && /^    settings:/  { kset = 1 }
              chk && kset && /^      keeper_server\/four_letter_word_allow_list: / { print "fourlw=" $2 }
              chk && /^          replicasCount: /           { print "voters=" $2 }
            ' rendered.yaml)
            assert_fact() {
              if ! echo "$facts" | grep -qxF "$1"; then
                echo "Rendered replication wiring is wrong or missing: expected '$1'."
                echo "Extracted facts were:"
                echo "$facts"
                exit 1
              fi
            }
            assert_fact 'path="/clickhouse/tables/{cluster}/{shard}/{database}/{table}"'
            assert_fact 'name="{replica}"'
            assert_fact 'zkhost=keeper-otel'
            assert_fact 'zkport=2181'
            assert_fact 'voters=5'
            assert_fact 'fourlw="ruok,mntr,srvr,stat,conf"'
            echo "ClickHouse replication wiring rendered correctly."

  publish-dev:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - install-helm
      - login-dockerhub
      - add-helm-repos
      - run:
          name: Build and publish dev chart (latest + per-commit)
          command: |
            SHORT_SHA=$(git rev-parse --short=7 HEAD)
            DEV_VERSION="0.0.0-dev.g${SHORT_SHA}"
            helm dependency build charts/ao-data-platform
            helm package charts/ao-data-platform --version "$DEV_VERSION"
            helm push "ao-data-platform-${DEV_VERSION}.tgz" "oci://registry-1.docker.io/montecarlodata"
            helm package charts/ao-data-platform --version "0.0.0-latest"
            helm push "ao-data-platform-0.0.0-latest.tgz" "oci://registry-1.docker.io/montecarlodata"
            echo "Published ${DEV_VERSION} and 0.0.0-latest"

  publish-tag:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Verify tag is on main
          command: |
            git fetch --quiet origin main
            if ! git merge-base --is-ancestor "$CIRCLE_TAG" origin/main; then
              echo "Tag $CIRCLE_TAG is not an ancestor of origin/main — refusing to publish."
              exit 1
            fi
            echo "Tag $CIRCLE_TAG is on main, proceeding."
      - run:
          name: Verify Chart.yaml version matches tag
          command: |
            CHART_VERSION=$(awk '/^version:/ {gsub(/"/, "", $2); print $2; exit}' charts/ao-data-platform/Chart.yaml)
            EXPECTED="${CIRCLE_TAG#v}"
            if [ "$CHART_VERSION" != "$EXPECTED" ]; then
              echo "Chart.yaml version ($CHART_VERSION) does not match tag ($EXPECTED) — refusing to publish."
              exit 1
            fi
            echo "Chart.yaml version ($CHART_VERSION) matches tag, proceeding."
      - install-helm
      - login-dockerhub
      - add-helm-repos
      - run:
          name: Build and publish tagged release
          command: |
            VERSION="${CIRCLE_TAG#v}"
            echo "Publishing chart version: $VERSION"
            helm dependency build charts/ao-data-platform
            helm package charts/ao-data-platform --version "$VERSION"
            helm push "ao-data-platform-${VERSION}.tgz" "oci://registry-1.docker.io/montecarlodata"

workflows:
  build:
    jobs:
      - lint:
          filters:
            tags:
              only: /^v.*/
      - publish-dev:
          requires:
            - lint
          context: *dockerhub_context
          filters:
            branches:
              only: dev
      - publish-tag:
          requires:
            - lint
          context: *dockerhub_context
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
