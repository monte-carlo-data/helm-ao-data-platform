# Render-test placeholders only; never deploy this file.
clickhouse:
  replicasCount: 2
  backup:
    enabled: true
    aws:
      bucket: ao-backup-render-test
      region: us-west-1
      roleArn: arn:aws:iam::123456789012:role/ao-backup-render-test
      path: render-test
    serviceAccount:
      name: ci-clickhouse-backup
    sidecar:
      image: altinity/clickhouse-backup:2.8.2@sha256:bc32794f2bd95d780bf6a0fea093d0ee463ec8e7dc486ccb845ce47b3406fad5
    user:
      externalSecret:
        secretStoreRef:
          name: ci-placeholder
        remoteRef:
          key: ci-backup-current
          property: password
          version: AWSCURRENT
        previousKey: ci-backup-previous
    probe:
      externalSecret:
        secretStoreRef:
          name: ci-placeholder
        remoteRef:
          key: ci-backup-probe-current
          property: password
          version: AWSCURRENT
        previousKey: ci-backup-probe-previous
    api:
      existingSecret: ci-backup-api
      passwordRevision: revision-1

gateway:
  enabled: false
