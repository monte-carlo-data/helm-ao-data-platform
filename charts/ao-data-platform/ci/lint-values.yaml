# Minimal values that let `helm template` fully render in CI.
#
# `helm lint` does not fully render subchart values, so a typo or wrong nesting
# in a deep path (e.g. the operator's `altinity-clickhouse-operator.configs.files`
# label allowlist) would pass lint while being silently ignored. The lint job
# renders the chart with these values to catch that, but the always-on ClickHouse
# users have required ExternalSecret fields with no defaults — supply placeholders
# here so the render reaches every template. These are CI placeholders only and
# are never deployed.
clickhouse:
  # Non-default replica count — and distinct from keeper's 5 below — so the CI render
  # proves clickhouse.replicasCount actually reaches BOTH the CHI's layout.replicasCount
  # and the minDomains on its zone spread (a hardcoded or misnamed key would render the
  # default and Helm would never complain — no values.schema.json). Distinct from keeper
  # so neither CR can borrow the other's value and still pass.
  replicasCount: 3
  # Exercise the ClickHouse nodeSelector/tolerations `with` branches in the CHI pod
  # template (skipped at the empty defaults), mirroring the keeper block below and
  # how the consuming terraform pins ClickHouse to its dedicated per-AZ node groups.
  nodeSelector:
    dedicated: clickhouse
  tolerations:
    - key: dedicated
      operator: Equal
      value: clickhouse
      effect: NoSchedule
  otel:
    externalSecret:
      secretStoreRef:
        name: ci-placeholder
      remoteRef:
        key: ci-placeholder
  schemaOwner:
    externalSecret:
      secretStoreRef:
        name: ci-placeholder
      remoteRef:
        key: ci-placeholder
  llmWorker:
    externalSecret:
      secretStoreRef:
        name: ci-placeholder
      remoteRef:
        key: ci-placeholder
  monteCarlo:
    externalSecret:
      secretStoreRef:
        name: ci-placeholder
      remoteRef:
        key: ci-placeholder

# Exercise the (default-off) Gateway path so its four templates — gateway,
# gateway-httproutes, gateway-certificates, gateway-backend-tls — render in CI.
# tls.enabled defaults true, so the Gateway→backend re-encrypt path renders against a
# valid config. CI placeholders only; never deployed.
gateway:
  enabled: true
  provider: azure
  otelHostname: otel.ci-placeholder.internal
  clickhouseHostname: clickhouse.ci-placeholder.internal
  # Exercise the source-range branch (defaults to [], otherwise never rendered in CI) so the
  # azure-allowed-ip-ranges annotation + its join/quote are covered. Asserted in the lint job.
  allowedSourceRanges:
    - 10.0.0.0/16
    - 192.168.1.0/24
  tls:
    letsencrypt:
      # Both solver blocks are populated so either provider render (azure by default here,
      # gke via --set in the gke render step) has its required DNS-01 fields. The chart emits
      # only the one matching gateway.provider.
      azureDNS:
        hostedZoneName: ci-placeholder.internal
        resourceGroupName: ci-placeholder
        subscriptionID: ci-placeholder
        managedIdentityClientID: ci-placeholder
      cloudDNS:
        project: ci-placeholder-project

# Exercise the Keeper nodeSelector/tolerations `with` branches in the CHK pod template
# (skipped at the empty defaults) so the render — CI's template-correctness guard —
# actually covers them, matching how the consuming terraform pins Keeper to its
# dedicated node groups. CI placeholders only; never deployed.
keeper:
  # Non-default voter count so the CI render proves keeper.replicasCount actually
  # reaches the CHK's layout.replicasCount — a misnamed key would silently render
  # the default and Helm would never complain (no values.schema.json).
  replicasCount: 5
  nodeSelector:
    dedicated: keeper
  tolerations:
    - key: dedicated
      operator: Equal
      value: keeper
      effect: NoSchedule
