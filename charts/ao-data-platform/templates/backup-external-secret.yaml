{{- include "ao-data-platform.backupValidate" . -}}
{{- if .Values.clickhouse.backup.enabled }}
{{- $b := .Values.clickhouse.backup }}
{{- range $entry := list (dict "name" "backup" "cfg" $b.user) (dict "name" "backup_probe" "cfg" $b.probe) }}
{{- $cfg := $entry.cfg }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $cfg.secret }}
  labels:
    {{- include "ao-data-platform.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $cfg.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ required (printf "clickhouse.backup %s secretStoreRef.name is required." $entry.name) $cfg.externalSecret.secretStoreRef.name }}
    kind: {{ $cfg.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ $cfg.secret }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        password: {{ "{{ .password }}" | quote }}
        {{- if eq $entry.name "backup" }}
        config.yml: |
          {{- include "ao-data-platform.backupConfig" $ | nindent 10 }}
        {{- end }}
        # An empty credential omits the whole user; it never enables passwordless auth.
        auth.xml: |
          <clickhouse>
          {{ "{{- if .password }}" }}
            <users>
            <{{ $entry.name }}>
              <networks>
                {{- if eq $entry.name "backup" }}
                <ip>127.0.0.1</ip><ip>::1</ip>
                {{- else }}
                <ip>0.0.0.0/0</ip><ip>::/0</ip>
                {{- end }}
              </networks>
              <grants>
                <query>GRANT SHOW TABLES, SHOW DATABASES ON otel_traces.*</query>
                {{- if eq $entry.name "backup" }}
                <query>GRANT BACKUP ON otel_traces.*</query>
                <query>GRANT SELECT ON system.*</query>
                {{- else }}
                <query>GRANT SELECT ON system.replicas</query>
                {{- end }}
              </grants>
              <auth_methods>
                <current><password>{{ "{{ .password | html }}" }}</password></current>
                {{- if $cfg.externalSecret.previousKey }}
                {{ "{{- if and .previous (ne .previous \"-\") }}" }}
                <previous><password>{{ "{{ .previous | html }}" }}</password></previous>
                {{ "{{- end }}" }}
                {{- end }}
              </auth_methods>
            </{{ $entry.name }}>
            </users>
          {{ "{{- end }}" }}
          </clickhouse>
  data:
    - secretKey: password
      remoteRef:
        {{- include "ao-data-platform.externalSecretRemoteRef" (dict "key" $cfg.externalSecret.remoteRef.key "remoteRef" $cfg.externalSecret.remoteRef "errorContext" (printf "for the %s user" $entry.name)) | nindent 8 }}
    {{- if $cfg.externalSecret.previousKey }}
    - secretKey: previous
      remoteRef:
        {{- include "ao-data-platform.externalSecretRemoteRef" (dict "key" $cfg.externalSecret.previousKey "remoteRef" $cfg.externalSecret.remoteRef "errorContext" (printf "for the previous %s password" $entry.name)) | nindent 8 }}
    {{- end }}
{{- end }}
{{- with $b.api.externalSecret }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "ao-data-platform.backupAPISecretName" $ }}
  labels:
    {{- include "ao-data-platform.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ .refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ required "clickhouse.backup.api.externalSecret.secretStoreRef.name is required." .secretStoreRef.name }}
    kind: {{ .secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ include "ao-data-platform.backupAPISecretName" $ }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        password: {{ "{{ .credentials | fromJson | dig \"password\" \"\" }}" | quote }}
        revision: {{ "{{ .credentials | fromJson | dig \"revision\" \"\" }}" | quote }}
  data:
    - secretKey: credentials
      remoteRef:
        {{- include "ao-data-platform.externalSecretRemoteRef" (dict "key" .remoteRef.key "remoteRef" .remoteRef "errorContext" "for the backup API password and revision") | nindent 8 }}
{{- end }}
{{- end }}
