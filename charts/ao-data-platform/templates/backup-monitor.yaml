{{- include "ao-data-platform.backupValidate" . -}}
{{- if and .Values.clickhouse.backup.enabled .Values.clickhouse.backup.monitoring.enabled }}
{{- $m := .Values.clickhouse.backup.monitoring }}
{{- $name := printf "%s-backup-monitor" (include "ao-data-platform.chiName" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clickhouse-backup-monitor
  annotations:
    eks.amazonaws.com/role-arn: {{ $m.aws.roleArn | quote }}
  labels:
    {{- include "ao-data-platform.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "ao-data-platform.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    resourceNames: [{{ printf "%s-backup" (include "ao-data-platform.chiName" .) | quote }}]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "ao-data-platform.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: clickhouse-backup-monitor
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "ao-data-platform.labels" . | nindent 4 }}
data:
  check_backup.py: |
    {{- .Files.Get "files/clickhouse-backup/check_backup.py" | nindent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  labels:
    {{- include "ao-data-platform.labels" . | nindent 4 }}
spec:
  schedule: "*/5 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 240
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: clickhouse-backup-monitor
        spec:
          serviceAccountName: clickhouse-backup-monitor
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: monitor
              image: {{ $m.image | quote }}
              command: ["/var/lang/bin/python3", "/scripts/check_backup.py"]
              env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: CLUSTER_NAME
                  value: {{ $m.aws.clusterName | quote }}
                - name: AWS_REGION
                  value: {{ $m.aws.region | quote }}
                - name: AWS_EC2_METADATA_DISABLED
                  value: "true"
                - name: AWS_STS_REGIONAL_ENDPOINTS
                  value: regional
                - name: BACKUP_CRONJOB
                  value: {{ printf "%s-backup" (include "ao-data-platform.chiName" .) | quote }}
                - name: BACKUP_MAX_AGE_SECONDS
                  value: {{ $m.maxAgeSeconds | quote }}
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
              resources:
                requests: {cpu: 25m, memory: 64Mi}
                limits: {memory: 128Mi}
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: script
              configMap:
                name: {{ $name }}
{{- end }}
