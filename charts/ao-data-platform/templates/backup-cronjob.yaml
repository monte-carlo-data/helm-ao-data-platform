{{- include "ao-data-platform.backupValidate" . -}}
{{- if .Values.clickhouse.backup.enabled }}
{{- $b := .Values.clickhouse.backup }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ao-data-platform.chiName" . }}-backup-job
  labels:
    {{- include "ao-data-platform.labels" . | nindent 4 }}
data:
  backup_common.py: |
    {{- .Files.Get "files/clickhouse-backup/backup_common.py" | nindent 4 }}
  run_backup.py: |
    {{- .Files.Get "files/clickhouse-backup/run_backup.py" | nindent 4 }}
  {{- if $b.cleanup.enabled }}
  cleanup_backups.py: |
    {{- .Files.Get "files/clickhouse-backup/cleanup_backups.py" | nindent 4 }}
  {{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "ao-data-platform.chiName" . }}-backup
  labels:
    {{- include "ao-data-platform.labels" . | nindent 4 }}
spec:
  schedule: {{ $b.schedule.cron | quote }}
  timeZone: Etc/UTC
  suspend: {{ $b.schedule.suspend }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ $b.schedule.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A lost API response may still have started a backup. Never blindly retry.
      backoffLimit: 0
      activeDeadlineSeconds: {{ add (int $b.schedule.timeoutSeconds) (ternary (int $b.cleanup.timeoutSeconds) 0 $b.cleanup.enabled) 60 }}
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: clickhouse-backup-job
        spec:
          serviceAccountName: {{ include "ao-data-platform.chiName" . }}-backup-job
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: {{ $b.schedule.image | quote }}
              command: ["python3", "/scripts/run_backup.py"]
              env:
                - name: BACKUP_ENDPOINTS
                  value: {{ include "ao-data-platform.backupEndpoints" . | quote }}
                - name: BACKUP_DATABASE_ENDPOINTS
                  value: {{ include "ao-data-platform.backupDatabaseEndpoints" . | quote }}
                - name: BACKUP_PROBE_USERNAME
                  value: backup_probe
                - name: BACKUP_PROBE_PASSWORD_FILE
                  value: /probe-credentials/password
                - name: BACKUP_PASSWORD_REVISION
                  value: {{ $b.api.passwordRevision | quote }}
                - name: BACKUP_PASSWORD_REVISION_FILE
                  value: /credentials/revision
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: BACKUP_POD_NAMES
                  value: {{ include "ao-data-platform.backupPodNames" . | quote }}
                {{- if .Values.tls.enabled }}
                - name: BACKUP_DATABASE_CA_FILE
                  value: /clickhouse-ca/ca.crt
                {{- end }}
                - name: BACKUP_PASSWORD_FILE
                  value: /credentials/password
                - name: BACKUP_TIMEOUT_SECONDS
                  value: {{ $b.schedule.timeoutSeconds | quote }}
                - name: BACKUP_MAX_REPLICA_DELAY_SECONDS
                  value: {{ $b.schedule.maxReplicaDelaySeconds | quote }}
                - name: BACKUP_FRESHNESS_RETRY_SECONDS
                  value: {{ $b.schedule.freshnessRetrySeconds | quote }}
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                {{- if $b.cleanup.enabled }}
                - name: BACKUP_CLEANUP_ENABLED
                  value: "true"
                - name: BACKUP_CLEANUP_DRY_RUN
                  value: {{ $b.cleanup.dryRun | quote }}
                - name: BACKUP_KEEP_LAST
                  value: {{ $b.cleanup.keepLast | quote }}
                - name: BACKUP_KEEP_DAYS
                  value: {{ $b.cleanup.keepDays | quote }}
                - name: BACKUP_CLEANUP_TIMEOUT_SECONDS
                  value: {{ $b.cleanup.timeoutSeconds | quote }}
                {{- end }}
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: credentials
                  mountPath: /credentials
                  readOnly: true
                - name: probe-credentials
                  mountPath: /probe-credentials
                  readOnly: true
                {{- if .Values.tls.enabled }}
                - name: clickhouse-ca
                  mountPath: /clickhouse-ca
                  readOnly: true
                {{- end }}
              resources:
                {{- toYaml $b.schedule.resources | nindent 16 }}
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: script
              configMap:
                name: {{ include "ao-data-platform.chiName" . }}-backup-job
            - name: credentials
              secret:
                secretName: {{ include "ao-data-platform.backupAPISecretName" . }}
                optional: true
            - name: probe-credentials
              secret:
                secretName: {{ $b.probe.secret }}
                optional: true
            {{- if .Values.tls.enabled }}
            - name: clickhouse-ca
              secret:
                secretName: clickhouse-server-tls
                items:
                  - {key: ca.crt, path: ca.crt}
            {{- end }}
{{- end }}
