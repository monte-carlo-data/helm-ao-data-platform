{{- include "ao-data-platform.gatewayValidate" . }}
{{- if and .Values.gateway.enabled (eq .Values.gateway.tls.source "letsencrypt") }}
# Let's Encrypt (ACME DNS-01) certs for the two Gateway listeners. The cert-manager
# identity referenced by the solver below is created by the Terraform module.
# (letsencrypt is currently the only supported tls.source; a BYO-cert source is
# reserved for a future release.)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ include "ao-data-platform.clusterScopedName" . }}-letsencrypt-dns01
  labels:
    {{- include "ao-data-platform.labels" . | nindent 4 }}
spec:
  acme:
    server: {{ .Values.gateway.tls.letsencrypt.server }}
    {{- with .Values.gateway.tls.letsencrypt.email }}
    email: {{ . | quote }}  # optional ACME contact; omitted registers a contactless account
    {{- end }}
    privateKeySecretRef:
      # Cluster-scoped-issuer account key lives in the cert-manager namespace — qualify it
      # too so same-named releases in different namespaces don't share one ACME account.
      name: {{ include "ao-data-platform.clusterScopedName" . }}-letsencrypt-account-key
    solvers:
      # DNS-01 solver is cloud-specific (cert-manager schema); Azure DNS shown.
      - dns01:
          azureDNS:
            hostedZoneName: {{ required "gateway.tls.letsencrypt.azureDNS.hostedZoneName is required" .Values.gateway.tls.letsencrypt.azureDNS.hostedZoneName | quote }}
            resourceGroupName: {{ required "gateway.tls.letsencrypt.azureDNS.resourceGroupName is required" .Values.gateway.tls.letsencrypt.azureDNS.resourceGroupName | quote }}
            subscriptionID: {{ required "gateway.tls.letsencrypt.azureDNS.subscriptionID is required" .Values.gateway.tls.letsencrypt.azureDNS.subscriptionID | quote }}
            environment: AzurePublicCloud
            managedIdentity:
              clientID: {{ required "gateway.tls.letsencrypt.azureDNS.managedIdentityClientID is required" .Values.gateway.tls.letsencrypt.azureDNS.managedIdentityClientID | quote }}
---
# The listener Certificate / secretName values are deliberately stable literals: they must
# match the certificateRefs in gateway.yaml and follow the chart's existing internal-TLS
# naming convention (e.g. otel-collector-tls, ao-data-platform-ca in tls-issuer.yaml). These
# are namespaced resources, so fixed names are safe across namespaces. The cluster-scoped
# ClusterIssuer above uses the clusterScopedName helper (fullname + namespace) instead,
# because a bare fullname would collide across namespaces for same-named releases.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gateway-otel-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ao-data-platform.labels" . | nindent 4 }}
spec:
  secretName: gateway-otel-tls
  dnsNames:
    - {{ .Values.gateway.otelHostname | quote }}
  issuerRef:
    name: {{ include "ao-data-platform.clusterScopedName" . }}-letsencrypt-dns01
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gateway-clickhouse-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ao-data-platform.labels" . | nindent 4 }}
spec:
  secretName: gateway-clickhouse-tls
  dnsNames:
    - {{ .Values.gateway.clickhouseHostname | quote }}
  issuerRef:
    name: {{ include "ao-data-platform.clusterScopedName" . }}-letsencrypt-dns01
    kind: ClusterIssuer
{{- end }}
