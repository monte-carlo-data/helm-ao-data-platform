{{- if lt (int .Values.keeper.replicasCount) 1 }}
{{- fail "keeper.replicasCount must be >= 1. minDomains on the zone topologySpreadConstraints below is set from this value, and the Kubernetes API rejects minDomains: 0." }}
{{- end }}
# ClickHouse Keeper ensemble (Raft coordination for ReplicatedMergeTree).
#
# Deployed as an Altinity ClickHouseKeeperInstallation (CHK); the same
# altinity-clickhouse-operator subchart that reconciles the CHI also reconciles this.
# The ClickHouse server is wired to it via spec.configuration.zookeeper in
# templates/clickhouse-installation.yaml (host = the operator-created `keeper-<chk>`
# Service, port 2181).
#
# Keeper is intrinsic to the clustered design — this renders on every install; a
# dev/small deployment just sets keeper.replicasCount: 1. Prod runs 3 voters, one per
# AZ (hard topology spread below), so a quorum of 2 survives losing one AZ.
apiVersion: "clickhouse-keeper.altinity.com/v1"
kind: "ClickHouseKeeperInstallation"
metadata:
  name: {{ include "ao-data-platform.chkName" . }}
  labels:
    {{- include "ao-data-platform.labels" . | nindent 4 }}
spec:
  configuration:
    {{- with .Values.keeper.fourLetterWordAllowList }}
    settings:
      # Trim the four-letter-word commands served unauthenticated on the client port
      # (Keeper's built-in default includes cluster-affecting ones like rcvr/rqld).
      # Must keep ruok — the operator's injected liveness probe sends it. Omitted
      # entirely (falling back to Keeper's built-in default) when the value is "".
      keeper_server/four_letter_word_allow_list: {{ . | quote }}
    {{- end }}
    clusters:
      - name: "keeper"
        layout:
          replicasCount: {{ .Values.keeper.replicasCount }}
  defaults:
    templates:
      dataVolumeClaimTemplate: keeper-data
      podTemplate: keeper
  templates:
    podTemplates:
      - name: keeper
        spec:
          # `image` is required whenever this podTemplate emits a containers[] entry —
          # the Altinity operator does not merge container spec defaults (same as the
          # CHI podTemplate). The container name must match the operator's Keeper
          # container (`clickhouse-keeper`).
          containers:
            - name: clickhouse-keeper
              image: {{ .Values.keeper.image }}
              {{- with .Values.keeper.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
          {{- with .Values.keeper.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.keeper.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Hard AZ spread — one voter per zone. There is no cluster autoscaler in the
          # target environment, so the per-AZ Keeper node groups (provisioned by the
          # consuming terraform) must pre-exist or a voter stays Pending. DoNotSchedule
          # (not ScheduleAnyway) is deliberate: a 3-voter quorum that packed 2 voters
          # into one AZ would lose its single-AZ-failure tolerance.
          #
          # minDomains is what makes that guarantee real; maxSkew alone does not.
          # Skew is measured only across zones that already hold an eligible
          # (nodeSelector-matching) node — a zone with no such node is not a
          # zero-count domain, it is not a domain at all. With one eligible zone the
          # global minimum is that zone's own count, so skew stays 0 and every voter
          # packs in. minDomains forces the global minimum to 0 while fewer than this
          # many eligible domains exist, so the later voters stay Pending until their
          # zones' nodes appear. One voter per zone, so minDomains == replicasCount ==
          # the zone count it must cover. GA in k8s 1.30; valid only with DoNotSchedule.
          topologySpreadConstraints:
            - maxSkew: 1
              minDomains: {{ .Values.keeper.replicasCount }}
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  clickhouse-keeper.altinity.com/chk: {{ include "ao-data-platform.chkName" . }}
    volumeClaimTemplates:
      - name: keeper-data
        spec:
          {{- if .Values.keeper.storageClass }}
          storageClassName: {{ .Values.keeper.storageClass }}
          {{- end }}
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: {{ .Values.keeper.storageSize }}
