{{- if .Values.clickhouse.backfill.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-backfill
  labels:
    {{- include "ao-data-platform.labels" . | nindent 4 }}
data:
  {{- range $path, $_ := .Files.Glob "backfill/*.sql" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
  {{- end }}
{{- end }}
