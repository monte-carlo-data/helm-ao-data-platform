{{- include "ao-data-platform.backupValidate" . -}}
{{- if .Values.clickhouse.backup.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ao-data-platform.chiName" . }}-backup-auth
  labels:
    {{- include "ao-data-platform.labels" . | nindent 4 }}
data:
  # Only new Pods mount this file; old Pods must never see paths to volumes
  # that their Pod template does not contain.
  backup-users.xml: |
    <clickhouse>
      <user_directories>
        <users_xml name="backup"><name>backup</name><path>/etc/clickhouse-backup-auth/user/users.xml</path></users_xml>
        <users_xml name="backup_probe"><name>backup_probe</name><path>/etc/clickhouse-backup-auth/probe/users.xml</path></users_xml>
      </user_directories>
    </clickhouse>
  # Optional Secrets overlay this fallback. Missing credentials omit the whole
  # user, so database startup and unrelated users do not depend on backup ESO.
  empty-auth.xml: <clickhouse/>
  user.xml: |
    <clickhouse>
      <include_from>/etc/clickhouse-backup-auth/user/auth.xml</include_from>
      <users><backup incl="user" optional="true"/></users>
    </clickhouse>
  probe.xml: |
    <clickhouse>
      <include_from>/etc/clickhouse-backup-auth/probe/auth.xml</include_from>
      <users><backup_probe incl="user" optional="true"/></users>
    </clickhouse>
{{- end }}
