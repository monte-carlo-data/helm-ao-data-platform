{{- include "ao-data-platform.gatewayValidate" . }}
{{- if .Values.gateway.enabled }}
# Kubernetes Gateway API. One Gateway, two HTTPS listeners terminating TLS
# per-hostname for the collector and ClickHouse. Backends are ClusterIP; the
# internal self-signed path is untouched.
#
# The Gateway's load balancer is forced internal (private IP only): the collector
# and ClickHouse endpoints are never publicly reachable and are accessed over private
# connectivity. How internal-ness + source restriction are expressed is cloud-specific
# (see gateway.provider) — azure uses LB annotations; gke uses the internal GatewayClass
# (gke-l7-rilb) plus a GCPBackendPolicy (gateway-gke-security-policy.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "ao-data-platform.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ao-data-platform.labels" . | nindent 4 }}
spec:
  {{- if eq .Values.gateway.provider "azure" }}
  infrastructure:
    annotations:
      # Force the Gateway's load balancer internal (private IP only).
      service.beta.kubernetes.io/azure-load-balancer-internal: "true"
      {{- with .Values.gateway.allowedSourceRanges }}
      # Restrict the (internal) LB to these source CIDRs (unioned across both listeners).
      service.beta.kubernetes.io/azure-allowed-ip-ranges: {{ join "," . | quote }}
      {{- end }}
  {{- end }}
  gatewayClassName: {{ include "ao-data-platform.gatewayClassName" . }}
  listeners:
    - name: otel
      hostname: {{ required "gateway.otelHostname is required when gateway.enabled" .Values.gateway.otelHostname | quote }}
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: gateway-otel-tls
      allowedRoutes:
        namespaces:
          from: Same
    - name: clickhouse
      hostname: {{ required "gateway.clickhouseHostname is required when gateway.enabled" .Values.gateway.clickhouseHostname | quote }}
      port: 8443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: gateway-clickhouse-tls
      allowedRoutes:
        namespaces:
          from: Same
{{- end }}
