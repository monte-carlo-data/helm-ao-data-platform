apiVersion: "clickhouse.altinity.com/v1"
kind: "ClickHouseInstallation"
metadata:
  name: {{ include "ao-data-platform.chiName" . }}
  labels:
    {{- include "ao-data-platform.labels" . | nindent 4 }}
spec:
  configuration:
    clusters:
      - name: "otel"
        layout:
          shardsCount: 1
          replicasCount: {{ .Values.clickhouse.replicasCount }}
    # ClickHouse Keeper ensemble backing ReplicatedMergeTree. Points at the operator-
    # created Keeper client Service (keeper-<chk>, port 2181). Present from this chart
    # version so the coordination layer is live before any table becomes Replicated;
    # plain MergeTree tables simply don't use it. See clickhouse-keeper-installation.yaml.
    zookeeper:
      nodes:
        - host: {{ include "ao-data-platform.keeperServiceName" . }}
          port: 2181
    # Adding a ClickHouse user? Also update values.yaml and templates/external-secret.yaml.
    users:
      otel/password:
        valueFrom:
          secretKeyRef:
            name: {{ .Values.clickhouse.otel.secret }}
            key: password
      otel/networks/ip:
        {{- toYaml .Values.clickhouse.otel.networksIp | nindent 8 }}
      {{- if .Values.clickhouse.otel.restrictGrants }}
      # otel (ingest) — restricted to INSERT on the telemetry source tables. The MV cascade runs
      # as schema_owner (the MV DEFINER), so otel needs nothing on the normalized targets. Gated
      # so it can stay broad until external readers have moved to monte_carlo, then be flipped on.
      otel/grants/query:
        - "GRANT INSERT ON otel_traces.otel_traces"
        # otel_metrics is created at runtime by the collector's metrics exporter (not the schema Job), hence no SQL file.
        - "GRANT INSERT ON otel_traces.otel_metrics"
      {{- end }}
      # schema_owner — DDL/owner identity for the schema Job and the persistent MV DEFINER.
      # Full DDL on otel_traces + ALTER on specific system-log tables (TTLs) + SYSTEM FLUSH LOGS;
      # deliberately NO access management.
      schema_owner/password:
        valueFrom:
          secretKeyRef:
            name: {{ .Values.clickhouse.schemaOwner.secret }}
            key: password
      schema_owner/networks/ip:
        {{- toYaml .Values.clickhouse.schemaOwner.networksIp | nindent 8 }}
      schema_owner/grants/query:
        # CREATE DATABASE cannot be scoped to a single database in ClickHouse — it is irreducibly
        # global. A future reader should not attempt to narrow this to a specific database.
        - "GRANT CREATE DATABASE ON *.*"
        - "GRANT CREATE TABLE, CREATE VIEW, ALTER, SELECT, INSERT, DROP, OPTIMIZE ON otel_traces.*"
        # ALTER granted only on the specific system-log tables whose TTLs the schema Job manages
        # (ALTER TABLE system.<log> MODIFY TTL). Derived from the modify_ttl_if_exists calls in
        # templates/schema-job.yaml. Do not widen back to system.* — that would include system
        # tables the schema Job never touches.
        - "GRANT ALTER ON system.query_log"
        - "GRANT ALTER ON system.query_thread_log"
        - "GRANT ALTER ON system.query_views_log"
        - "GRANT ALTER ON system.part_log"
        - "GRANT ALTER ON system.trace_log"
        - "GRANT ALTER ON system.metric_log"
        - "GRANT ALTER ON system.text_log"
        - "GRANT SYSTEM FLUSH LOGS ON *.*"
        # Every statement the schema Job runs is ON CLUSTER, and ClickHouse gates ON CLUSTER
        # queries behind the CLUSTER privilege (on_cluster_queries_require_cluster_grant is on
        # by default in this CH line) — without this the Job fails ACCESS_DENIED on its first
        # statement. The privilege is irreducibly global; it cannot be scoped below *.*.
        - "GRANT CLUSTER ON *.*"
      # llm_worker — the llm-worker Deployment. Reads the queue, appends results (no mutations).
      llm_worker/password:
        valueFrom:
          secretKeyRef:
            name: {{ .Values.clickhouse.llmWorker.secret }}
            key: password
      llm_worker/networks/ip:
        {{- toYaml .Values.clickhouse.llmWorker.networksIp | nindent 8 }}
      llm_worker/grants/query:
        - "GRANT SELECT ON otel_traces.llm_batches"
        - "GRANT SELECT ON otel_traces.llm_inputs"
        - "GRANT SELECT ON otel_traces.llm_results"
        - "GRANT INSERT ON otel_traces.llm_batches"
        - "GRANT INSERT ON otel_traces.llm_results"
      # monte_carlo — Monte Carlo read-only service account + agent queue producer. Shared reader
      # bundle plus the queue/eval-score INSERTs. NO readonly profile: readonly=2 would block these
      # INSERTs, so the read-mostly shape is enforced by grants alone.
      monte_carlo/password:
        valueFrom:
          secretKeyRef:
            name: {{ .Values.clickhouse.monteCarlo.secret }}
            key: password
      monte_carlo/networks/ip:
        {{- toYaml .Values.clickhouse.monteCarlo.networksIp | nindent 8 }}
      monte_carlo/grants/query:
        {{- include "ao-data-platform.readerGrants" . | nindent 8 }}
        - "GRANT INSERT ON otel_traces.llm_inputs"
        - "GRANT INSERT ON otel_traces.llm_batches"
        - "GRANT INSERT ON otel_traces.conversation_eval_scores"
        - "GRANT INSERT ON otel_traces.conversation_cluster_assignments"
      {{- if .Values.clickhouse.admin.enabled }}
      # admin — gated break-glass superuser: full access + user management + SYSTEM. Not for
      # service-to-service. Defaults to loopback-only (admin.networksIp), so it's usable only
      # by exec-ing into the pod.
      admin/password:
        valueFrom:
          secretKeyRef:
            name: {{ .Values.clickhouse.admin.secret }}
            key: password
      admin/networks/ip:
        {{- toYaml .Values.clickhouse.admin.networksIp | nindent 8 }}
      # GRANT ALL includes the ACCESS MANAGEMENT privilege group (CREATE USER / GRANT / …), so a
      # separate access_management setting is unnecessary — and ClickHouse rejects combining any
      # legacy access-control setting (access_management) with config-level `grants`.
      admin/grants/query:
        - "GRANT ALL ON *.* WITH GRANT OPTION"
      {{- end }}
      {{- if .Values.clickhouse.readonlyUser.enabled }}
      readonly_user/password:
        valueFrom:
          secretKeyRef:
            name: {{ .Values.clickhouse.readonlyUser.secret }}
            key: password
      readonly_user/networks/ip:
        {{- toYaml .Values.clickhouse.readonlyUser.networksIp | nindent 8 }}
      readonly_user/profile: readonly_settings
      # Shared reader bundle (same as monte_carlo's reads): otel_traces.* + the system /
      # information_schema metadata reads DataGrip/MCP need. Going explicit removes the implicit
      # all-DB read a config user would otherwise have; readonly=2 (above) stays orthogonal and
      # governs SET, not table access.
      readonly_user/grants/query:
        {{- include "ao-data-platform.readerGrants" . | nindent 8 }}
      {{- end }}
    {{- if .Values.clickhouse.readonlyUser.enabled }}
    profiles:
      # readonly=2 keeps the user SELECT-only but allows per-session SET; the
      # built-in `readonly` profile is mode 1 and rejects all setting changes,
      # which breaks JDBC clients (DataGrip etc.) on handshake.
      readonly_settings/readonly: "2"
    {{- end }}
    files:
      # Remove the built-in `default` user. Stock ClickHouse ships `default`
      # with an empty password and `access_management: 1` (full superuser).
      # The Altinity operator restricts its networks to pod IPs but leaves the
      # password empty, so it stays a passwordless superuser reachable from
      # inside the pod. Nothing in this chart authenticates as `default` (all
      # clients use `otel`; the operator uses its own `clickhouse_operator`
      # user), so removing it is safe. See Altinity docs/security_hardening.md.
      users.d/remove_default_user.xml: |
        <clickhouse>
          <users>
            <default remove="1"/>
          </users>
        </clickhouse>
      # probe — the identity the /ready readiness handler executes as (see
      # config.d/readiness_handler.xml below). Defined as a raw users.d file rather
      # than through the operator `users:` section so nothing can attach a password
      # to it: the handler's <user> field authenticates with an empty password, so
      # the user must genuinely be no_password. Networks stay open because kubelet
      # probes arrive from node IPs; the exposure is bounded by the grants — config
      # <grants> are exhaustive, so this user can read system.replicas plus table
      # *metadata* (SHOW TABLES; no data access) and nothing else — plus a
      # readonly=2 profile as defense-in-depth. Not listed in values.yaml/
      # external-secret.yaml on purpose: it has no secret and is not a
      # caller-facing user.
      users.d/probe_user.xml: |
        <clickhouse>
          <profiles>
            <!-- readonly=2, not 1: SELECT-only while per-session SET stays allowed;
                 mode 1 rejects all setting changes, which can trip HTTP clients that
                 pass settings with the request (same rationale as the gated
                 readonly_settings profile above). Belt-and-braces on top of the
                 exhaustive grant below. -->
            <probe_profile>
              <readonly>2</readonly>
            </probe_profile>
          </profiles>
          <users>
            <probe>
              <no_password/>
              <networks>
                <ip>::/0</ip>
              </networks>
              <profile>probe_profile</profile>
              <quota>default</quota>
              <grants>
                <query>GRANT SELECT ON system.replicas</query>
                <!-- Load-bearing, not cosmetic: system.replicas filters its rows to
                     tables the querying user can see, so without visibility of the
                     otel_traces tables the probe reads an EMPTY system.replicas and
                     can never fail — a readonly replica would stay "ready". SHOW
                     TABLES grants that visibility without any data access. -->
                <query>GRANT SHOW TABLES ON otel_traces.*</query>
              </grants>
            </probe>
          </users>
        </clickhouse>
      # Writer-safe readiness endpoint, probed by the pod readinessProbe (see the
      # podTemplate below). A replica that loses its Keeper session goes readonly
      # but keeps answering /ping with 200 — and /replicas_status also stays 200 in
      # CH 26.4 — so the default probes would keep the Service routing INSERTs to a
      # replica that can't accept them (writers then hang ~120s in
      # WaitForAsyncInsert rather than failing fast). This handler throws (HTTP 500)
      # whenever any table on the replica is readonly, dropping the replica out of
      # the Service until it rejoins Keeper. <defaults/> keeps the built-in
      # handlers (/ping, dynamic queries, …) working — without it this rule would
      # replace them all.
      config.d/readiness_handler.xml: |
        <clickhouse>
          <http_handlers>
            <rule>
              <url>/ready</url>
              <methods>GET</methods>
              <handler>
                <type>predefined_query_handler</type>
                <query>SELECT throwIf(count() &gt; 0) FROM system.replicas WHERE is_readonly</query>
                <user>probe</user>
              </handler>
            </rule>
            <defaults/>
          </http_handlers>
        </clickhouse>
      {{- if .Values.tls.enabled }}
      server.crt:
        valueFrom:
          secretKeyRef:
            name: clickhouse-server-tls
            key: tls.crt
      server.key:
        valueFrom:
          secretKeyRef:
            name: clickhouse-server-tls
            key: tls.key
      ca.crt:
        valueFrom:
          secretKeyRef:
            name: clickhouse-server-tls
            key: ca.crt
      {{- end }}
    settings:
      # Replicated tables register under a macro-based ZooKeeper path (NOT the built-in
      # {uuid} default). Load-bearing for the in-place MergeTree->Replicated conversion:
      # a converted table keeps its old UUID while a freshly-created replica gets a new
      # one, so a {uuid} path would make them two unrelated replicas that never sync.
      # {cluster}/{shard}/{replica} are operator-injected macros; {database}/{table} are
      # ClickHouse built-ins — both replicas resolve to the same path and clone. Set now
      # (harmless while tables are MergeTree) so it's already in place at conversion time.
      default_replica_path: "/clickhouse/tables/{cluster}/{shard}/{database}/{table}"
      default_replica_name: "{replica}"
      # Cap CH memory at 80% of the cgroup limit. Requires
      # clickhouse.resources.limits.memory to be set so the ratio resolves
      # to the pod's cgroup limit rather than host RAM.
      max_server_memory_usage_to_ram_ratio: "0.8"
      # Quiet the server log for steady-state prod volume. CH defaults to
      # trace/information, which is too chatty for production.
      logger/level: notice
      # System log retention (capping these tables, which CH otherwise grows
      # without bound) is applied post-start by the schema Job, NOT here.
      # CH 26.4 ships each system-log table with an inline `<engine>` that
      # already carries a TTL, and the server rejects a separate `<ttl>`
      # setting on top of it ("If 'engine' is specified for system table, TTL
      # parameters should be specified directly inside 'engine'…", Code: 36) —
      # so configuring `query_log/ttl` here aborts startup. The Job applies the
      # retention via `ALTER TABLE system.<log> MODIFY TTL` instead; see
      # templates/schema-job.yaml.
      {{- if .Values.tls.enabled }}
      tcp_port_secure: "9440"
      https_port: "8443"
      openSSL/server/certificateFile: /etc/clickhouse-server/secrets.d/server.crt/clickhouse-server-tls/tls.crt
      openSSL/server/privateKeyFile: /etc/clickhouse-server/secrets.d/server.key/clickhouse-server-tls/tls.key
      openSSL/server/caConfig: /etc/clickhouse-server/secrets.d/ca.crt/clickhouse-server-tls/ca.crt
      {{- end }}
  defaults:
    templates:
      dataVolumeClaimTemplate: data
      serviceTemplate: clickhouse-svc
      podTemplate: clickhouse
  templates:
    # Always emitted (the pre-2.3.0 conditional escape hatch to operator defaults
    # is gone): the writer-safe readinessProbe and the zone spread below are
    # load-bearing chart behavior, not optional tuning.
    podTemplates:
      - name: clickhouse
        spec:
          # `image` is required whenever this podTemplate emits a containers[]
          # entry — the Altinity operator does not merge container spec defaults.
          containers:
            - name: clickhouse
              image: {{ .Values.clickhouse.image }}
              {{- with .Values.clickhouse.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              # Startup gate only — steady-state liveness stays operator-injected
              # (/ping). Generous window: large mark-cache warmups on restart can
              # otherwise trip liveness and create restart loops.
              startupProbe:
                httpGet:
                  path: /ping
                  {{- if .Values.tls.enabled }}
                  port: 8443
                  scheme: HTTPS
                  {{- else }}
                  port: 8123
                  {{- end }}
                failureThreshold: 30
                periodSeconds: 10
              # Writer-safe readiness (replaces the operator-injected readiness
              # probe, which the operator only adds when none is user-defined):
              # /ready is the readonly-failing handler defined in
              # config.d/readiness_handler.xml above. A replica partitioned from
              # Keeper — or running its entire initial clone — reports not-Ready
              # for the whole event, which is exactly the point: the Service must
              # not route writes to it. Gate operational waits on system.replicas
              # checks, not on pod Ready.
              readinessProbe:
                httpGet:
                  path: /ready
                  {{- if .Values.tls.enabled }}
                  port: 8443
                  scheme: HTTPS
                  {{- else }}
                  port: 8123
                  {{- end }}
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
          {{- with .Values.clickhouse.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.clickhouse.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Hard AZ spread — replicas land in distinct zones (mirrors the CHK
          # spread in clickhouse-keeper-installation.yaml). No cluster autoscaler
          # in the target environment, so the per-AZ ClickHouse node groups must
          # pre-exist or the second replica stays Pending. DoNotSchedule is
          # deliberate: two replicas in one AZ would silently forfeit the
          # single-AZ-failure tolerance HA exists for. Trivially satisfied at
          # replicasCount: 1 (dev).
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  clickhouse.altinity.com/chi: {{ include "ao-data-platform.chiName" . }}
    serviceTemplates:
      - name: clickhouse-svc
        metadata:
          {{- if or .Values.clickhouse.service.annotations .Values.clickhouse.hostname }}
          annotations:
            {{- with .Values.clickhouse.service.annotations }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.clickhouse.hostname }}
            external-dns.alpha.kubernetes.io/hostname: {{ .Values.clickhouse.hostname }}
            {{- end }}
          {{- else }}
          {}
          {{- end }}
        spec:
          type: {{ .Values.clickhouse.service.type }}
          ports:
            {{- if .Values.tls.enabled }}
            - name: https
              port: 8443
            - name: tcp-secure
              port: 9440
            {{- else }}
            - name: http
              port: 8123
            - name: tcp
              port: 9000
            {{- end }}
    volumeClaimTemplates:
      - name: data
        spec:
          {{- if .Values.clickhouse.storageClass }}
          storageClassName: {{ .Values.clickhouse.storageClass }}
          {{- end }}
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: {{ .Values.clickhouse.storageSize }}
