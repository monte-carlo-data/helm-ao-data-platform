{{- include "ao-data-platform.backupValidate" . -}}
{{- if .Values.clickhouse.backup.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ao-data-platform.chiName" . }}-backup-api
  labels:
    {{- include "ao-data-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      clickhouse.altinity.com/chi: {{ include "ao-data-platform.chiName" . }}
  policyTypes: [Ingress]
  ingress:
    # Preserve existing database, replication, and metrics access. This rule
    # deliberately excludes 7171; policies select pods, not individual ports.
    - ports:
        - {protocol: TCP, port: 8123}
        - {protocol: TCP, port: 8443}
        - {protocol: TCP, port: 9000}
        - {protocol: TCP, port: 9440}
        - {protocol: TCP, port: 9009}
        - {protocol: TCP, port: 9363}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: clickhouse-backup-job
      ports:
        - {protocol: TCP, port: 7171}
{{- end }}
