{{- include "ao-data-platform.backupValidate" . -}}
{{- if .Values.clickhouse.backup.enabled }}
{{- $name := printf "%s-backup-job" (include "ao-data-platform.chiName" .) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "ao-data-platform.labels" . | nindent 4 }}
rules:
  # Pod annotations are checked before credentials are sent during a rotation.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
    resourceNames: {{ include "ao-data-platform.backupPodNames" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "ao-data-platform.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
{{- end }}
