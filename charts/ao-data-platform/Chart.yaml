apiVersion: v2
name: ao-data-platform
description: Monte Carlo data platform — ClickHouse, OTel collector, and schema management
# 5.0.0 — breaking. The ClickHouse SQL users moved out of the operator `users:`
# spec into a static users.d fragment whose auth is substituted from an
# ESO-assembled secret, so each user can hold two valid passwords during a
# rotation (YET-2680). Upgrading rolls ClickHouse ONCE (the pod template gains
# the secret mount); every rotation after that is restartless (rotations issue
# SYSTEM RELOAD CONFIG via the consuming module's rotation tooling). Direct
# chart consumers who set clickhouse.<user>.externalSecret need no change;
# consumers who patched the CHI users spec or rely on the operator rendering
# these users must review the fragment.
version: 5.0.0
type: application
# minDomains on the ClickHouse/Keeper zone topologySpreadConstraints is GA in
# Kubernetes 1.30. Declare the floor so a render/install against an older API
# server fails fast rather than silently dropping the field.
# Minor bump, not major: the floor only makes explicit what minDomains already
# required — pre-1.30 the field is rejected/dropped, so failing render is the
# honest version of an already-broken install.
kubeVersion: ">=1.30.0-0"

dependencies:
  - name: altinity-clickhouse-operator
    version: 0.26.0
    repository: https://docs.altinity.com/clickhouse-operator/
  - name: opentelemetry-collector
    version: 0.151.0
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
