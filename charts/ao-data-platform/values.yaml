clickhouse:
  # ClickHouse server image — required whenever the CHI's podTemplate is
  # emitted (Altinity operator does not merge container spec defaults).
  # Pinning here moves image lifecycle ownership (CVE/version bumps) onto
  # this chart; the AO team owns periodic review and bumps. Pinned to an
  # immutable patch tag (not `:latest` or a floating minor) so deployments
  # are reproducible. Note: `26.4` is a deliberate jump from the Altinity
  # 0.26.0 operator default of `23.8` — adopt with intent on first install.
  image: clickhouse/clickhouse-server:26.4.3
  # Number of ClickHouse replicas in the (single-shard) cluster. Default 2 is the
  # HA shape this chart's SQL is built for: every table is a path-less Replicated*
  # engine and all DDL runs ON CLUSTER, so a fresh install's replicas share one
  # schema and clone data via Keeper. Dev/small installs override this to 1 (and
  # keeper.replicasCount to 1) — same code path, sized down, matching the
  # prod-shaped-defaults philosophy of the keeper block below. Installs upgrading
  # with pre-existing plain-MergeTree data MUST hold this at 1 until the in-place
  # convert_to_replicated conversion has verified — the consuming terraform owns
  # the value during that migration and stages it 1 → 2; raising it against
  # unconverted tables starts an independent, empty second lineage. See the
  # README's "ClickHouse replication and Keeper" section. This count also feeds
  # minDomains on the CHI zone spread (templates/clickhouse-installation.yaml) —
  # one replica per zone — so an under-zoned cluster leaves the excess replica
  # Pending rather than silently co-locating both replicas in one AZ.
  replicasCount: 2
  storageClass: ""
  storageSize: 100Gi
  # Data retention, in days, for the telemetry tables — the raw traces, the
  # trace-id timestamp index, and the normalized spans. The schema job re-applies
  # this on every install and upgrade via `ALTER TABLE … MODIFY TTL`, so changing
  # it here takes effect on existing tables (unlike the system-log TTLs); the SQL
  # files carry the same value as their create-time default. A consuming terraform
  # module's `clickhouse_ttl_days` variable maps onto this key.
  #
  # Scope: telemetry only. The llm_* tables are the LLM worker's job-queue state
  # (batches/inputs/results), not customer telemetry, and keep their own fixed
  # TTL in SQL (see sql/0008–0010) — their retention is an operational concern
  # tracked separately from this knob.
  #
  # Note: shrinking the value purges already-expired data lazily on the next
  # background merge, not immediately — see README for the manual-purge escape hatch.
  ttlDays: 30
  # Adding a ClickHouse user? Also update templates/clickhouse-installation.yaml and templates/external-secret.yaml.
  # otel — the OTel collector ingest identity. Writes raw telemetry into otel_traces.otel_traces.
  # The MV cascade runs as schema_owner (the MV DEFINER), so otel needs nothing on the
  # normalized targets.
  otel:
    # Name of the K8s Secret containing a "password" key for the otel user.
    # This secret is created by the ExternalSecret below.
    secret: ao-clickhouse-otel-credentials
    # CIDR list allowed to authenticate as the otel user. Default is open. Network reachability is
    # typically restricted one layer up at the load balancer's source ranges (set by the deploying
    # environment); this CH-user-level list is independent of that. Per-caller CH-level network
    # scoping (otel → pod CIDR, etc.) is handled separately.
    networksIp:
      - "0.0.0.0/0"
    # When true, otel is restricted (via config grants) to INSERT on otel_traces.otel_traces
    # only — the least-privilege ingest role for the OTel collector. The MV cascade runs as
    # schema_owner (the MV DEFINER), so otel needs nothing on the normalized targets. Default
    # false keeps otel broad (implicit full access) so it can be enabled in a later step, once any
    # external readers have moved to the monte_carlo user and the MVs are reparented onto schema_owner.
    restrictGrants: false
    externalSecret:
      secretStoreRef:
        name: ""                  # user must provide
        kind: ClusterSecretStore
      remoteRef:
        key: ""                   # user must provide
        property: ""              # optional, for JSON secrets
        version: ""               # optional, required for Fake provider
      refreshInterval: 1h
  # schema_owner — owns the schema and is the materialized-view DEFINER. Used by the
  # schema-migration Job for all DDL (CREATE DATABASE/TABLE/VIEW/MV), the telemetry-table
  # TTL ALTERs, the system-log TTL ALTERs, and SYSTEM FLUSH LOGS. Because the MVs run under
  # this user as their DEFINER, it must persist with its grants for the normalization
  # pipeline to keep writing. Created by the ExternalSecret below.
  schemaOwner:
    secret: ao-clickhouse-schema-owner-credentials
    # CIDR list allowed to authenticate as schema_owner (in-cluster). Default open; tighten per
    # environment as needed. Per-caller network scoping is handled separately.
    networksIp:
      - "0.0.0.0/0"
    externalSecret:
      secretStoreRef:
        name: ""                  # user must provide
        kind: ClusterSecretStore
      remoteRef:
        key: ""                   # user must provide
        property: ""              # optional, for JSON secrets
        version: ""               # optional, required for Fake provider
      refreshInterval: 1h
  # llm_worker — identity for the llm-worker Deployment. Reads the LLM job queue and appends
  # results back (no mutations): SELECT on llm_batches/llm_inputs/llm_results, INSERT on
  # llm_batches/llm_results. Created by the ExternalSecret below.
  llmWorker:
    secret: ao-clickhouse-llm-worker-credentials
    # CIDR list allowed to authenticate as llm_worker (in-cluster). Default open; tighten per env.
    networksIp:
      - "0.0.0.0/0"
    externalSecret:
      secretStoreRef:
        name: ""                  # user must provide
        kind: ClusterSecretStore
      remoteRef:
        key: ""                   # user must provide
        property: ""              # optional, for JSON secrets
        version: ""               # optional, required for Fake provider
      refreshInterval: 1h
  # monte_carlo — the Monte Carlo read-only service account (data-source monitoring) and the
  # agent's LLM-queue producer. Reads everything via the shared reader bundle and appends to the
  # queue (llm_inputs/llm_batches) + conversation_eval_scores. NOT a readonly-profile user — it
  # needs INSERT, so its read-mostly shape is enforced by grants alone. Created by the
  # ExternalSecret below. (The agent's credential is configured in the consuming application, not
  # here — the chart only provisions the user + password.)
  monteCarlo:
    secret: ao-clickhouse-monte-carlo-credentials
    # CIDR list allowed to authenticate as monte_carlo (external callers: the agent + monitoring).
    # Default open; tightening to the caller's real source is handled separately.
    networksIp:
      - "0.0.0.0/0"
    externalSecret:
      secretStoreRef:
        name: ""                  # user must provide
        kind: ClusterSecretStore
      remoteRef:
        key: ""                   # user must provide
        property: ""              # optional, for JSON secrets
        version: ""               # optional, required for Fake provider
      refreshInterval: 1h
  # admin — gated break-glass superuser: full access + user management + SYSTEM. OFF by default.
  # By default it is reachable only over loopback (see networksIp), so using it requires exec-ing
  # into the ClickHouse pod — i.e. "who can be admin" reduces to who can exec into the pod. NOT for
  # service-to-service: routine grant changes go through the chart (config grants + upgrade), not
  # this user. It exists for SYSTEM / BACKUP / ad-hoc DDL the operator never performs and which no
  # other user can do once the default superuser is removed.
  admin:
    enabled: false
    secret: ao-clickhouse-admin-credentials
    # CIDR list allowed to authenticate as admin. Defaults to loopback only, so admin is usable
    # solely by exec-ing into the ClickHouse pod and connecting locally. Override only if you
    # genuinely need remote admin; remote reads should use readonly_user instead. (::1 is included
    # because clickhouse-client commonly resolves localhost to IPv6 loopback.)
    networksIp:
      - "127.0.0.1"
      - "::1"
    externalSecret:
      secretStoreRef:
        name: ""                  # user must provide
        kind: ClusterSecretStore
      remoteRef:
        key: ""                   # user must provide
        property: ""              # optional, for JSON secrets
        version: ""               # optional, required for Fake provider
      refreshInterval: 1h
  readonlyUser:
    enabled: false
    # Name of the K8s Secret containing a "password" key for the readonly_user.
    # Created by the gated ExternalSecret below when enabled = true.
    secret: ao-clickhouse-readonly-user-credentials
    # CIDR list allowed to authenticate as readonly_user (human/MCP/JDBC clients). Default open;
    # per-caller tightening is handled separately.
    networksIp:
      - "0.0.0.0/0"
    externalSecret:
      secretStoreRef:
        name: ""                  # user must provide
        kind: ClusterSecretStore
      remoteRef:
        key: ""                   # user must provide
        property: ""              # optional, for JSON secrets
        version: ""               # optional, required for Fake provider
      refreshInterval: 1h
  hostname: ""    # if set, adds external-dns.alpha.kubernetes.io/hostname annotation
  service:
    type: ClusterIP
    annotations: {}
  # Pod scheduling for the ClickHouse server. Wired into the CHI's
  # podTemplate; defaults are no-ops.
  nodeSelector: {}
  tolerations: []
  # Resource requests/limits for the ClickHouse server container. Sized to
  # fit on a t3.large (8 GiB) node with headroom for kubelet and other
  # system pods. CPU limit intentionally omitted — ClickHouse is bursty
  # and benefits from using spare CPU when available.
  #
  # NOTE: limits.memory feeds CH's max_server_memory_usage_to_ram_ratio
  # (set to 0.8 in the CHI). Keep it set — if removed, CH falls back to
  # host RAM detection and can OOM-kill the node on a multi-tenant host.
  resources:
    requests:
      cpu: 250m
      memory: 2Gi
    limits:
      memory: 4Gi

# ClickHouse Keeper — the coordination ensemble (Raft) that backs ReplicatedMergeTree
# tables. Deployed as an Altinity ClickHouseKeeperInstallation (CHK); the ClickHouse
# server (CHI) is wired to it via spec.configuration.zookeeper (see
# templates/clickhouse-installation.yaml) and resolves replica paths through the
# operator-injected macros (default_replica_path). Keeper is intrinsic to the clustered
# design — there is no keeper-less mode; a dev/small install just sizes it down to
# replicasCount: 1. See the README's "ClickHouse replication and Keeper" section for
# the two-apply HA migration ordering.
keeper:
  # Number of Keeper voters. Prod HA = 3 (a quorum of 2 tolerates losing one voter /
  # one AZ); dev = 1. Should be odd (Raft quorum). The consuming terraform derives
  # this from the length of its Keeper availability-zone list, so the voter count
  # cannot drift from the number of per-AZ Keeper node groups. It also feeds
  # minDomains on the CHK zone spread (templates/clickhouse-keeper-installation.yaml),
  # so an under-zoned ensemble leaves later voters Pending rather than packing an AZ.
  # Named `replicasCount`
  # (not the Helm-conventional `replicaCount`) to match both the CRD field it feeds
  # (the CHK's layout.replicasCount) and its sibling clickhouse.replicasCount.
  replicasCount: 3
  # Keeper image. Pinned to track the ClickHouse server release line (clickhouse.image
  # is clickhouse-server:26.4.3); the AO team owns periodic bumps, same as the server
  # image. NOTE: confirm this exact tag is published for clickhouse-keeper before the
  # first deploy — the operator will otherwise fail to pull.
  image: clickhouse/clickhouse-keeper:26.4.3
  storageClass: ""
  # Keeper persists only coordination metadata (Raft log + snapshots), not telemetry,
  # so a small volume is ample. A replaced voter re-syncs its state from the quorum,
  # so this does not need a Retain reclaim policy (plain gp3 / Delete is fine).
  storageSize: 10Gi
  # Resource requests/limits for the Keeper container. Sized to sit comfortably on a
  # 2 vCPU / 8 GiB node (the terraform default is m6i.large) with OOM headroom — a
  # throttled or OOM-killed voter risks spurious leader elections. CPU limit omitted
  # deliberately (Keeper is bursty on failover). Tune per environment.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 4Gi
  # Pod scheduling for Keeper voters. The consuming terraform sets these to pin Keeper
  # to its dedicated, tainted node groups (dedicated=keeper); defaults are no-ops. Hard
  # AZ spread across topology.kubernetes.io/zone is applied in the CHK pod template
  # itself (templates/clickhouse-keeper-installation.yaml), not here.
  nodeSelector: {}
  tolerations: []
  # Network isolation for Keeper. Keeper speaks the unauthenticated ZooKeeper protocol —
  # any pod that can reach the client port (2181) gets read/write on the entire
  # coordination tree — and network isolation (not protocol auth) is the standard
  # production posture for Keeper/ZooKeeper ensembles. This ships a NetworkPolicy
  # restricting Keeper ingress to the ClickHouse server pods, the operator, and the
  # Keeper Raft peers (see templates/keeper-networkpolicy.yaml). Enabled by default:
  # on clusters without a NetworkPolicy engine the policy object is inert, so there is
  # no keeper-less-secure mode to opt into by accident. Disable only if the policy
  # conflicts with the cluster's CNI.
  networkPolicy:
    enabled: true
  # Keeper four-letter-word admin commands, exposed unauthenticated on the client port.
  # Trimmed from Keeper's built-in default — which includes cluster-affecting commands
  # like rcvr (force recovery mode) and rqld (request leadership) — down to the liveness
  # probe (ruok; the operator's injected probe sends it over loopback) plus read-only
  # introspection (mntr, srvr, stat, conf; hack/verify-deployment.sh uses mntr). Extend
  # per environment if an operational runbook needs more; set to "" to fall back to
  # Keeper's built-in default list. Keep ruok in any custom list or liveness fails.
  fourLetterWordAllowList: "ruok,mntr,srvr,stat,conf"

tls:
  enabled: true
  certManager:
    createCA: true
    existingIssuerRef: {}
    # existingIssuerRef:
    #   name: my-issuer
    #   kind: Issuer  # or ClusterIssuer

# Internal TLS termination via the Kubernetes Gateway API. Opt-in: when enabled, a single
# Gateway terminates TLS for the collector + ClickHouse (ClusterIP backends) at per-hostname
# HTTPS listeners. The Gateway's load balancer is always internal (private IP) — these
# endpoints are never publicly reachable. The internal self-signed path (tls.* above) is
# untouched. Requires tls.enabled=true: the Gateway always re-encrypts to the backends, so
# it needs the internal-TLS listeners (enforced at render time). Disabled by default.
#
# The load-balancer annotations (gateway.yaml) and the cert-manager DNS-01 solver
# (gateway.tls.letsencrypt below) are the cloud-specific layer — shipped for Azure; other clouds
# substitute their own annotation keys and cert-manager solver. The Terraform module
# supplies the GatewayClass, the internal-LB add-on, and the cert-manager identity.
gateway:
  enabled: false
  # Cloud that renders provider-specific Gateway resources: "azure" or "gke". REQUIRED when
  # gateway.enabled — there is no default (no cloud is privileged); each cloud's Terraform
  # module sets it. Selects the source-range mechanism (azure annotation vs GKE
  # GCPBackendPolicy) and the GKE-only health-check policy.
  provider: ""
  # GatewayClass. Cloud-specific, so it is NOT defaulted to any one cloud — when empty it is
  # derived from gateway.provider (azure -> approuting-istio, gke -> gke-l7-rilb). Set
  # explicitly only to override with a custom GatewayClass.
  className: ""
  # Hostnames for the two listeners. Must resolve to the Gateway's private LB IP (e.g.
  # via a private DNS zone). Let's Encrypt DNS-01 still issues publicly-trusted certs for
  # these names — validation is via DNS records, not endpoint reachability.
  otelHostname: ""
  clickhouseHostname: ""
  # Restrict the Gateway's (internal) load balancer to source CIDRs. Empty = no restriction
  # (any client with network reach to the private LB). The mechanism is provider-specific:
  #   - azure: allowedSourceRanges (CIDRs) → azure-allowed-ip-ranges LB annotation.
  #   - gke:   gcpBackendSecurityPolicy (the name of a regional Cloud Armor policy the
  #            Terraform module builds from the CIDRs) → a GCPBackendPolicy per backend.
  # Set only the one matching gateway.provider; the other must stay empty (enforced at render).
  allowedSourceRanges: []
  gcpBackendSecurityPolicy: ""
  tls:
    # letsencrypt is the only supported source. A BYO-cert source is reserved for a
    # future release; any other value fails at render time.
    source: letsencrypt
    letsencrypt:
      email: ""
      server: https://acme-v02.api.letsencrypt.org/directory
      # Cloud-specific cert-manager DNS-01 solver config, selected by gateway.provider. Each
      # cloud's Terraform module fills in the block for its provider; the other stays empty.
      # (route53 etc. reserved for future clouds.)
      # azure:
      azureDNS:
        hostedZoneName: ""
        resourceGroupName: ""
        subscriptionID: ""
        managedIdentityClientID: "" # cert-manager Workload Identity (from the TF module)
      # gke: cert-manager uses ambient GKE Workload Identity (no SA key); only the project
      # hosting the Cloud DNS zone is needed.
      cloudDNS:
        project: ""

# Altinity ClickHouse Operator
altinity-clickhouse-operator:
  fullnameOverride: clickhouse-operator
  # Restrict which of the CHI's metadata.labels the operator propagates onto the
  # resources it generates (StatefulSet, Pod, PVC/volumeClaimTemplates).
  #
  # This is an allowlist (`include`): when non-empty, ONLY the listed label keys
  # are propagated; every other label stays on the CHI but is not stamped onto
  # child resources. An allowlist is used rather than an `exclude` blocklist
  # deliberately — the StatefulSet's volumeClaimTemplates are immutable, so any
  # change to a propagated label there cannot be patched in place and forces the
  # operator to delete+recreate the StatefulSet (onUpdateFailure: recreate),
  # which bounces ClickHouse. A blocklist would let a future volatile label slip
  # through and silently reintroduce that bounce; an allowlist freezes the
  # propagated set so no new label can ever mutate the immutable volumeClaimTemplates.
  #
  # In particular this keeps the volatile `helm.sh/chart` label (which encodes the
  # chart version) off the volumeClaimTemplates, so a chart-version bump with no
  # functional change does not recreate ClickHouse.
  #
  # NOTE: this only governs labels propagated FROM the CHI's metadata.labels. The
  # operator's own `clickhouse.altinity.com/*` labels — which it uses for its
  # StatefulSet/Service selectors and resource ownership — are managed separately
  # and are unaffected by this setting.
  configs:
    files:
      config.yaml:
        label:
          include:
            - app.kubernetes.io/name
            - app.kubernetes.io/instance
            - app.kubernetes.io/managed-by

# LLM Worker — polls ClickHouse for pending batches, calls AWS Bedrock, writes results back
llmWorker:
  # Number of llm-worker pods — 0 or 1 ONLY (the template rejects >1). The worker is
  # not designed to run as multiple copies: it has no job-claim/locking semantics, so
  # concurrent workers would double-process batches. Exposed so the consuming terraform
  # can pin it (e.g. to 0) as config that survives a `helm upgrade` — used to
  # pause/resume ingest-adjacent work during the HA migration window without a manual
  # `kubectl scale` being reset by the next apply.
  replicaCount: 1
  image:
    repository: ""
    tag: ""
  # LLM backend: "bedrock" (Claude on AWS Bedrock, configured via the llmWorker.aws.*
  # block — see the naming note below), "foundry" (Claude on Microsoft Foundry / Azure,
  # llmWorker.foundry.*), or "vertex" (Claude on GCP Vertex AI, llmWorker.vertex.*).
  # Selects LLM_PROVIDER + which provider-specific env the deployment renders.
  provider: bedrock
  # Bedrock (AWS) settings — used when provider is "bedrock". This block is named "aws" (not
  # "bedrock", unlike the foundry/vertex blocks below) for backward compatibility with existing
  # Terraform callers that set llmWorker.aws.region.
  aws:
    region: us-east-1
  # Foundry (Azure) settings — required (and only used) when provider is "foundry".
  # resource = the Foundry resource name; the AnthropicFoundry SDK builds
  # https://<resource>.services.ai.azure.com/anthropic/ from it. Auth is Entra ID
  # via AKS Workload Identity (no key) — set the managed-identity client-id on
  # serviceAccount.annotations ("azure.workload.identity/client-id") and the
  # "azure.workload.identity/use": "true" label on podLabels (Terraform wires both).
  foundry:
    resource: ""
  # Vertex (GCP) settings — required (and only used) when provider is "vertex".
  # project = the GCP project id; region = the Vertex location ("global" = the
  # global endpoint). Auth is ADC via GKE Workload Identity Federation — the GCP
  # module binds the worker KSA's WIF principal to a least-privilege Vertex role
  # (aiplatform.endpoints.predict only; no GCP service account, no annotation
  # needed). Worker honors the row's model_id.
  vertex:
    project: ""
    region: global
  serviceAccount:
    annotations: {}
  # Additional labels for the worker pod template — set per-environment as needed
  # (e.g. to opt into an identity/admission webhook).
  podLabels: {}
  # Extra env vars (e.g., MAX_WORKERS, POLL_INTERVAL)
  env: []
  # Resource requests/limits for the llm-worker container. Modest dev
  # defaults; bump via terraform tfvars per environment. CPU limit
  # intentionally omitted.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# OTel Collector subchart values
# NOTE: The config below assumes tls.enabled=true (the default). If you set
# tls.enabled=false, also override the opentelemetry-collector section to
# remove TLS receiver config, change the exporter endpoint back to port 9000,
# and remove the extraVolumes/extraVolumeMounts for TLS secrets.
opentelemetry-collector:
  fullnameOverride: opentelemetry-collector
  mode: deployment
  replicaCount: 1

  # Bound the collector's memory so memory_limiter has a fixed reference
  # rather than detecting from the (possibly oversubscribed) node.
  # 6Gi limit fits within the 8Gi t3.large nodes the collector schedules on,
  # leaving ~2Gi for kubelet and other system pods.
  resources:
    requests:
      cpu: 200m
      memory: 2Gi
    limits:
      memory: 6Gi

  image:
    repository: otel/opentelemetry-collector-contrib
    tag: ""

  ports:
    otlp:
      enabled: true
    otlp-http:
      enabled: true
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false

  service:
    type: ClusterIP

  initContainers:
    - name: wait-for-clickhouse-schema
      # Keep this tag in sync with clickhouse.image above — it can't reference
      # the parent chart's values from inside this subchart block.
      image: clickhouse/clickhouse-server:26.4.3
      command:
        - sh
        - -c
        - |
          echo "Waiting for otel_traces.otel_traces table..."
          until clickhouse-client --host clickhouse-otel --user otel --password "${CLICKHOUSE_PASSWORD}" --secure --port 9440 --query "EXISTS TABLE otel_traces.otel_traces" 2>/dev/null | grep -q 1; do
            sleep 2
          done
          echo "Database ready."
      env:
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              # Keep in sync with clickhouse.otel.secret — this sub-chart value is plain YAML
              # (not templated), so overriding clickhouse.otel.secret does not propagate here.
              name: ao-clickhouse-otel-credentials
              key: password
        - name: SSL_CERT_FILE
          value: /tls/clickhouse-ca/ca.crt
      volumeMounts:
        - name: clickhouse-ca
          mountPath: /tls/clickhouse-ca
          readOnly: true

  extraEnvs:
    - name: CLICKHOUSE_PASSWORD
      valueFrom:
        secretKeyRef:
          # Keep in sync with clickhouse.otel.secret — this sub-chart value is plain YAML
          # (not templated), so overriding clickhouse.otel.secret does not propagate here.
          name: ao-clickhouse-otel-credentials
          key: password
    - name: SSL_CERT_FILE
      value: /tls/clickhouse-ca/ca.crt

  extraVolumes:
    - name: otel-tls
      secret:
        secretName: otel-collector-tls
        optional: true
    - name: clickhouse-ca
      secret:
        secretName: clickhouse-server-tls
        optional: true
        items:
          - key: ca.crt
            path: ca.crt

  extraVolumeMounts:
    - name: otel-tls
      mountPath: /tls/otel
      readOnly: true
    - name: clickhouse-ca
      mountPath: /tls/clickhouse-ca
      readOnly: true

  config:
    receivers:
      jaeger: null
      zipkin: null
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            tls:
              cert_file: /tls/otel/tls.crt
              key_file: /tls/otel/tls.key
              reload_interval: 10m
          http:
            endpoint: 0.0.0.0:4318
            tls:
              cert_file: /tls/otel/tls.crt
              key_file: /tls/otel/tls.key
              reload_interval: 10m
      prometheus:
        config:
          scrape_configs:
            - job_name: otel-collector
              scrape_interval: 30s
              static_configs:
                - targets: ["${env:MY_POD_IP}:8888"]

    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch:
        timeout: 5s
        send_batch_size: 1000
        send_batch_max_size: 1500

    exporters:
      clickhouse:
        endpoint: tcp://clickhouse-otel.{{ .Release.Namespace }}.svc.cluster.local:9440?secure=true
        json: true
        database: otel_traces
        username: otel
        password: ${env:CLICKHOUSE_PASSWORD}
        create_schema: false
        compress: lz4
        traces_table_name: otel_traces
        timeout: 30s
        async_insert: false
        sending_queue:
          enabled: true
          num_consumers: 2
          queue_size: 1000
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 30m

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
